      <path d="M5,-585 L-70,-490 L-85,-410" stroke="#b57b5c" stroke-width="34"/>
      <path d="M38,-610 L44,-640" stroke="#b57b5c" stroke-width="30"/>
      <path d="M28,-590 L-10,-395" stroke="#20263a" stroke-width="100"/>
      <path d="M-8,-405 L-16,-345" stroke="#141519" stroke-width="108"/>
      <path d="M34,-565 L8,-430" stroke="#ffffff" stroke-width="8" stroke-opacity="0.8"/>
      <path d="M-5,-360 L35,-200 L-6,-58" stroke="#b57b5c" stroke-width="54"/>
      <path d="M25,-585 L95,-505 L122,-570" stroke="#b57b5c" stroke-width="34"/>
      <path d="M25,-585 L58,-548" stroke="#20263a" stroke-width="46"/>
