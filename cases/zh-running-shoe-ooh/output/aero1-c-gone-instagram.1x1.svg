    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="walkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf9a" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#ffcf9a" stop-opacity="0.1"/>
