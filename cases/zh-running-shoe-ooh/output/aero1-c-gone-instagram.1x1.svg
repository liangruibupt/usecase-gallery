  <text x="54" y="138" font-family="Futura, 'Avenir Next', sans-serif" font-weight="700" font-size="112" fill="#fff8ee">182g.</text>
  <text x="57" y="196" font-family="Futura, 'Avenir Next', sans-serif" font-weight="500" font-size="36" fill="#fff8ee">Lighter than your phone.</text>

