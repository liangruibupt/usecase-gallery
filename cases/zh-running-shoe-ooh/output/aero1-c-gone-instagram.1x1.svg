      <stop offset="0.25" stop-color="#b77a7c"/>
      <stop offset="1" stop-color="#3a3048"/>
    </linearGradient>
    <linearGradient id="walkG" gradientUnits="userSpaceOnUse" x1="0" y1="880" x2="0" y2="1080">
      <stop offset="0" stop-color="#5c4a58"/>
      <stop offset="0.35" stop-color="#2f2634"/>
      <stop offset="1" stop-color="#121016"/>
