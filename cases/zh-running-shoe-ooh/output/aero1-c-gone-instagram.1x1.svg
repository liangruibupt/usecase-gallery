      <path d="M-120,-14 C-40,-16 60,-20 140,-30" stroke="#cfc8bd" stroke-width="3" fill="none"/>
      <path d="M162,-52 C20,-36 -110,-30 -172,-36 C-178,-55 -160,-72 -130,-82 C-90,-95 -50,-108 -10,-125 C30,-140 60,-146 85,-140 C105,-132 120,-135 135,-155 C150,-170 165,-160 166,-140 C170,-110 172,-75 162,-52 Z" fill="url(#upper)"/>
      <path d="M162,-52 C20,-36 -110,-30 -172,-36 C-178,-55 -160,-72 -130,-82 C-90,-95 -50,-108 -10,-125 C30,-140 60,-146 85,-140 C105,-132 120,-135 135,-155 C150,-170 165,-160 166,-140 C170,-110 172,-75 162,-52 Z" fill="url(#mesh)"/>
      <path d="M-110,-48 C-40,-68 40,-94 122,-122 L130,-108 C52,-80 -30,-56 -100,-40 Z" fill="#1c1a17"/>
      <path d="M85,-140 C105,-132 120,-135 135,-155 L141,-149 C126,-126 104,-122 84,-132 Z" fill="#2a2a2a"/>
      <path d="M148,-162 L166,-166 L168,-136 L158,-136 Z" fill="#1c1a17"/>
      <path d="M-40,-110 C0,-126 40,-142 82,-142" stroke="#1c1a17" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M-24,-118 l14,-12 M0,-127 l14,-11 M24,-134 l14,-10 M48,-139 l14,-8" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <path d="M150,-60 C160,-90 160,-120 152,-148" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" fill="none"/>
