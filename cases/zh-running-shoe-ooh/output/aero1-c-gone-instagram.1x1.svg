      <rect x="-60" y="720" width="1200" height="3" opacity="0.7"/>
      <rect x="-60" y="820" width="1200" height="3" opacity="0.7"/>
      <rect x="30" y="470" width="10" height="410"/>
      <rect x="200" y="470" width="10" height="410"/>
      <rect x="370" y="470" width="10" height="410"/>
      <rect x="540" y="470" width="10" height="410"/>
      <rect x="710" y="470" width="10" height="410"/>
      <rect x="1050" y="470" width="10" height="410"/>
