<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2DDD4"/>
      <stop offset="1" stop-color="#ECE8E0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6BC96"/>
      <stop offset="1" stop-color="#C8A77D"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F7F2"/>
      <stop offset="1" stop-color="#E7ECE3"/>
    </linearGradient>
    <linearGradient id="oakSw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CFAD82"/>
      <stop offset="1" stop-color="#C29C6E"/>
    </linearGradient>
    <pattern id="rattan" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D2B88E"/>
      <path d="M0,0 L10,10 M10,0 L0,10" stroke="#A98A5E" stroke-width="1.2"/>
    </pattern>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#DCCFBA"/>
      <rect y="1" width="6" height="1.4" fill="#CDBFA7"/>
      <rect x="1" width="1.4" height="6" fill="#E8DECC" opacity="0.8"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="img"><rect x="720" y="96" width="1080" height="504"/></clipPath>
    <clipPath id="sw1"><rect x="720" y="660" width="340" height="110"/></clipPath>
    <clipPath id="sw2"><rect x="1090" y="660" width="340" height="110"/></clipPath>
    <clipPath id="sw3"><rect x="1460" y="660" width="340" height="110"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="#FBFAF7"/>

  <!-- 左栏 -->
  <text x="120" y="150" font-family="'Avenir Next', sans-serif" font-size="16" letter-spacing="6" fill="#8A8278">05 — SPACE &amp; MATERIAL</text>
  <rect x="120" y="178" width="40" height="1.5" fill="#2A2826"/>
  <text x="118" y="262" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="56" letter-spacing="6" fill="#2A2826">空间与材质</text>

  <text font-family="'Songti SC', serif" font-size="44" fill="#2A2826" letter-spacing="2">
    <tspan x="120" y="400">少用几种材料，</tspan>
    <tspan x="120" y="466">把每一种</tspan>
    <tspan x="120" y="532">用到恰好。</tspan>
  </text>
  <rect x="120" y="590" width="60" height="1.5" fill="#A88660"/>

  <text font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="18" fill="#5E574F">
    <tspan x="120" y="650">我们的材料表通常很短：原木、石灰、亚麻，</tspan>
    <tspan x="120" y="682">再加一点水磨石、洞石与藤编。</tspan>
    <tspan x="120" y="714">同一种材料从地面延伸到柜体，空间就安静下来；</tspan>
    <tspan x="120" y="746">手会碰到的地方，留给有温度的表面。</tspan>
  </text>

  <text x="120" y="860" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="4" fill="#9A9288">PROJECT · 代表项目</text>
  <text x="120" y="896" font-family="'Source Han Sans SC', sans-serif" font-weight="400" font-size="17" fill="#2A2826">西溪 · 栖光住宅</text>
  <text x="120" y="926" font-family="'Source Han Sans SC', sans-serif" font-weight="400" font-size="17" fill="#2A2826">三口之家住宅改造 · 123㎡</text>

  <!-- 右栏主画面：餐厨材料组合 -->
  <g clip-path="url(#img)">
    <rect x="720" y="96" width="1080" height="374" fill="url(#wall)"/>
    <ellipse cx="1250" cy="200" rx="160" ry="70" fill="#EFEBE4" opacity="0.8" filter="url(#soft)"/>
    <ellipse cx="1460" cy="380" rx="120" ry="50" fill="#DCD6CC" opacity="0.6" filter="url(#soft)"/>
    <ellipse cx="1100" cy="300" rx="90" ry="40" fill="#E9E5DD" opacity="0.7" filter="url(#soft)"/>

    <rect x="720" y="470" width="1080" height="130" fill="url(#floor)"/>
    <line x1="720" y1="470" x2="1800" y2="470" stroke="#D8CFC1" stroke-width="3"/>
    <g stroke="#B08E64" stroke-opacity="0.3" stroke-width="1.2">
      <line x1="720" y1="502" x2="1800" y2="502"/>
      <line x1="720" y1="540" x2="1800" y2="540"/>
      <line x1="720" y1="582" x2="1800" y2="582"/>
      <line x1="880" y1="470" x2="880" y2="502"/>
      <line x1="1240" y1="470" x2="1240" y2="502"/>
      <line x1="1620" y1="470" x2="1620" y2="502"/>
      <line x1="1040" y1="502" x2="1040" y2="540"/>
      <line x1="1450" y1="502" x2="1450" y2="540"/>
      <line x1="820" y1="540" x2="820" y2="582"/>
      <line x1="1300" y1="540" x2="1300" y2="582"/>
      <line x1="1700" y1="540" x2="1700" y2="582"/>
    </g>

    <!-- 窗与亚麻帘 -->
    <rect x="1548" y="138" width="224" height="314" fill="#D8CFC1"/>
    <rect x="1560" y="150" width="200" height="290" fill="url(#sky)"/>
    <rect x="1560" y="150" width="200" height="290" fill="none" stroke="#B89A74" stroke-width="8"/>
    <line x1="1660" y1="150" x2="1660" y2="440" stroke="#B89A74" stroke-width="6"/>
    <rect x="1544" y="440" width="232" height="10" fill="#EAE4D9"/>
    <path d="M1730,120 L1796,120 L1800,462 L1722,462 C1730,360 1726,240 1730,120 Z" fill="#E4D9C6"/>
    <g stroke="#D2C4AD" stroke-width="2">
      <line x1="1748" y1="124" x2="1746" y2="460"/>
      <line x1="1770" y1="124" x2="1772" y2="460"/>
    </g>
    <line x1="1520" y1="120" x2="1800" y2="120" stroke="#8B7B66" stroke-width="3"/>
    <polygon points="1560,472 1760,472 1700,600 1430,600" fill="#FFFCF3" opacity="0.6" filter="url(#soft)"/>

    <!-- 橡木高柜 -->
    <ellipse cx="900" cy="474" rx="170" ry="8" fill="#7A6A55" opacity="0.22" filter="url(#softS)"/>
    <rect x="760" y="150" width="280" height="320" rx="10" fill="#C8A479"/>
    <rect x="760" y="150" width="280" height="6" rx="3" fill="#D8BA92"/>
    <g stroke="#B28E62" stroke-width="2">
      <line x1="853" y1="160" x2="853" y2="466"/>
      <line x1="947" y1="160" x2="947" y2="466"/>
    </g>
    <g fill="#A9845A">
      <rect x="842" y="290" width="4" height="40" rx="2"/>
      <rect x="860" y="290" width="4" height="40" rx="2"/>
      <rect x="936" y="290" width="4" height="40" rx="2"/>
    </g>

    <!-- 橡木地柜 + 藤编柜门 -->
    <rect x="1040" y="352" width="380" height="118" fill="#C29D70"/>
    <g stroke="#A9845A" stroke-width="2">
      <line x1="1135" y1="356" x2="1135" y2="468"/>
      <line x1="1230" y1="356" x2="1230" y2="468"/>
    </g>
    <rect x="1240" y="364" width="170" height="96" rx="8" fill="url(#rattan)" stroke="#B08D62" stroke-width="4"/>
    <line x1="1325" y1="364" x2="1325" y2="460" stroke="#B08D62" stroke-width="3"/>

    <!-- 水磨石台面 -->
    <rect x="1034" y="332" width="392" height="22" rx="3" fill="#EAE5DC"/>
    <g>
      <circle cx="1048" cy="339" r="2" fill="#B9A58A"/>
      <circle cx="1066" cy="346" r="1.5" fill="#8E9B80"/>
      <circle cx="1088" cy="340" r="2.2" fill="#C9B9A2"/>
      <circle cx="1110" cy="348" r="1.6" fill="#9A9288"/>
      <circle cx="1130" cy="338" r="2" fill="#B9A58A"/>
      <circle cx="1152" cy="345" r="1.4" fill="#8E9B80"/>
      <circle cx="1176" cy="340" r="2.4" fill="#C9B9A2"/>
      <circle cx="1198" cy="349" r="1.6" fill="#B9A58A"/>
      <circle cx="1220" cy="337" r="1.8" fill="#9A9288"/>
      <circle cx="1244" cy="345" r="2.2" fill="#8E9B80"/>
      <circle cx="1268" cy="339" r="1.5" fill="#B9A58A"/>
      <circle cx="1290" cy="347" r="2" fill="#C9B9A2"/>
      <circle cx="1312" cy="338" r="1.6" fill="#9A9288"/>
      <circle cx="1336" cy="346" r="2.3" fill="#B9A58A"/>
      <circle cx="1358" cy="340" r="1.5" fill="#8E9B80"/>
      <circle cx="1380" cy="348" r="2" fill="#C9B9A2"/>
      <circle cx="1404" cy="339" r="1.7" fill="#B9A58A"/>
    </g>
    <!-- 台面器物 -->
    <path d="M1078,332 C1070,312 1074,296 1088,290 L1096,290 C1110,296 1114,312 1106,332 Z" fill="#EFE9DE"/>
    <path d="M1360,332 C1360,320 1374,314 1392,314 C1410,314 1424,320 1424,332 Z" fill="#B8A588"/>

    <!-- 陶瓷吊灯 -->
    <ellipse cx="1230" cy="300" rx="190" ry="60" fill="#FFF4DC" opacity="0.45" filter="url(#glow)"/>
    <g stroke="#6E655B" stroke-width="1.5">
      <line x1="1150" y1="96" x2="1150" y2="250"/>
      <line x1="1310" y1="96" x2="1310" y2="250"/>
    </g>
    <path d="M1118,278 C1118,258 1132,248 1150,248 C1168,248 1182,258 1182,278 Z" fill="#F1ECE2"/>
    <ellipse cx="1150" cy="278" rx="32" ry="4" fill="#D7CDBD"/>
    <path d="M1278,278 C1278,258 1292,248 1310,248 C1328,248 1342,258 1342,278 Z" fill="#F1ECE2"/>
    <ellipse cx="1310" cy="278" rx="32" ry="4" fill="#D7CDBD"/>

    <!-- 材料标签 -->
    <g font-family="'Source Han Sans SC', sans-serif" font-weight="400" font-size="14" fill="#2A2826">
      <circle cx="1430" cy="190" r="9" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="1430" cy="190" r="4" fill="#2A2826"/>
      <rect x="1444" y="176" width="96" height="28" rx="14" fill="#FBFAF7" opacity="0.94"/>
      <text x="1456" y="195">微水泥墙面</text>

      <circle cx="900" cy="230" r="9" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="900" cy="230" r="4" fill="#2A2826"/>
      <rect x="914" y="216" width="82" height="28" rx="14" fill="#FBFAF7" opacity="0.94"/>
      <text x="926" y="235">橡木柜体</text>

      <circle cx="1180" cy="343" r="9" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="1180" cy="343" r="4" fill="#2A2826"/>
      <rect x="1194" y="372" width="96" height="28" rx="14" fill="#FBFAF7" opacity="0.94"/>
      <line x1="1180" y1="347" x2="1194" y2="386" stroke="#2A2826" stroke-width="1"/>
      <text x="1206" y="391">水磨石台面</text>

      <circle cx="1325" cy="430" r="9" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="1325" cy="430" r="4" fill="#2A2826"/>
      <rect x="1339" y="416" width="82" height="28" rx="14" fill="#FBFAF7" opacity="0.94"/>
      <text x="1351" y="435">藤编柜门</text>

      <circle cx="900" cy="540" r="9" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="900" cy="540" r="4" fill="#2A2826"/>
      <rect x="914" y="526" width="96" height="28" rx="14" fill="#FBFAF7" opacity="0.94"/>
      <text x="926" y="545">白橡木地板</text>
    </g>
  </g>
  <text x="720" y="634" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="13" fill="#9A9288">示意插画 · 餐厨与客厅的材料组合</text>

  <!-- 材料小样 -->
  <g clip-path="url(#sw1)">
    <rect x="720" y="660" width="340" height="110" fill="url(#oakSw)"/>
    <g stroke="#9F7A50" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M720,676 C800,668 900,688 1060,678"/>
      <path d="M720,694 C820,702 920,684 1060,696"/>
      <path d="M720,712 C810,706 860,722 880,718 C920,708 940,726 1060,714"/>
      <path d="M720,736 C820,744 940,728 1060,740"/>
      <path d="M720,756 C800,750 920,764 1060,754"/>
    </g>
    <ellipse cx="900" cy="720" rx="20" ry="6" fill="none" stroke="#9F7A50" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#sw2)">
    <rect x="1090" y="660" width="340" height="110" fill="#E4DED3"/>
    <ellipse cx="1160" cy="690" rx="70" ry="26" fill="#EFEAE1" filter="url(#softS)"/>
    <ellipse cx="1320" cy="740" rx="90" ry="24" fill="#D8D1C4" opacity="0.8" filter="url(#softS)"/>
    <ellipse cx="1390" cy="680" rx="50" ry="18" fill="#EDE8DF" filter="url(#softS)"/>
    <ellipse cx="1210" cy="752" rx="60" ry="14" fill="#DDD6CA" opacity="0.7" filter="url(#softS)"/>
  </g>
  <g clip-path="url(#sw3)">
    <rect x="1460" y="660" width="340" height="110" fill="url(#weave)"/>
  </g>

  <g font-family="'Source Han Sans SC', sans-serif">
    <text x="720" y="812" font-weight="400" font-size="24" fill="#2A2826">原木</text>
    <text x="1060" y="810" text-anchor="end" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="3" fill="#9A9288">OAK</text>
    <text font-weight="300" font-size="16" fill="#5E574F">
      <tspan x="720" y="850">白橡木地板、橡木柜体与书架，</tspan>
      <tspan x="720" y="878">主卧床头换成胡桃木，</tspan>
      <tspan x="720" y="906">收口一律做成圆角。</tspan>
    </text>

    <text x="1090" y="812" font-weight="400" font-size="24" fill="#2A2826">石灰</text>
    <text x="1430" y="810" text-anchor="end" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="3" fill="#9A9288">LIME PLASTER</text>
    <text font-weight="300" font-size="16" fill="#5E574F">
      <tspan x="1090" y="850">玄关用石灰涂料与洞石，</tspan>
      <tspan x="1090" y="878">客厅墙面是微水泥，</tspan>
      <tspan x="1090" y="906">哑光表面让光线变得柔和。</tspan>
    </text>

    <text x="1460" y="812" font-weight="400" font-size="24" fill="#2A2826">亚麻</text>
    <text x="1800" y="810" text-anchor="end" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="3" fill="#9A9288">LINEN</text>
    <text font-weight="300" font-size="16" fill="#5E574F">
      <tspan x="1460" y="850">主卧墙面铺亚麻墙布，</tspan>
      <tspan x="1460" y="878">书房书架与柜门配藤编，</tspan>
      <tspan x="1460" y="906">触感先于颜色被记住。</tspan>
    </text>
  </g>

  <!-- 页脚 -->
  <text x="120" y="1010" font-family="Didot, serif" font-size="18" fill="#2A2826">05 <tspan fill="#B0A89D">/ 09</tspan></text>
  <text x="1800" y="1010" text-anchor="end" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="4" fill="#9A9288">MUYU DESIGN STUDIO</text>
</svg>
