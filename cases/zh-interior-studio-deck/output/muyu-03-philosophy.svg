<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4DCCF"/>
      <stop offset="1" stop-color="#EFEAE1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2B68F"/>
      <stop offset="1" stop-color="#C4A277"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F7F2"/>
      <stop offset="1" stop-color="#E7ECE3"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="img"><rect x="720" y="96" width="1080" height="564"/></clipPath>
    <clipPath id="win"><rect x="1522" y="154" width="196" height="356"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="#FBFAF7"/>

  <!-- 左栏 -->
  <text x="120" y="150" font-family="'Avenir Next', sans-serif" font-size="16" letter-spacing="6" fill="#8A8278">03 — PHILOSOPHY</text>
  <rect x="120" y="178" width="40" height="1.5" fill="#2A2826"/>
  <text x="118" y="262" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="56" letter-spacing="6" fill="#2A2826">设计理念</text>

  <text font-family="'Songti SC', serif" font-size="44" fill="#2A2826" letter-spacing="2">
    <tspan x="120" y="400">留白不是空无，</tspan>
    <tspan x="120" y="466">是把光与风</tspan>
    <tspan x="120" y="532">请进来。</tspan>
  </text>
  <rect x="120" y="590" width="60" height="1.5" fill="#A88660"/>

  <text font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="18" fill="#5E574F">
    <tspan x="120" y="650">木屿设计是一家位于杭州的室内设计工作室，</tspan>
    <tspan x="120" y="682">专注住宅与小型商业空间。比起填满，</tspan>
    <tspan x="120" y="714">我们更在意留下什么——一面接得住阳光的墙，</tspan>
    <tspan x="120" y="746">一条让风穿过的路径，一处安放日常的角落。</tspan>
  </text>

  <text x="120" y="860" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="4" fill="#9A9288">SERVICES · 服务范围</text>
  <text x="120" y="896" font-family="'Source Han Sans SC', sans-serif" font-weight="400" font-size="17" fill="#2A2826">住宅全案设计 · 旧房改造</text>
  <text x="120" y="926" font-family="'Source Han Sans SC', sans-serif" font-weight="400" font-size="17" fill="#2A2826">软装陈设 · 小型商业空间（咖啡馆、买手店）</text>

  <!-- 右栏画面：午后的光与风 -->
  <g clip-path="url(#img)">
    <rect x="720" y="96" width="1080" height="424" fill="url(#wall)"/>
    <rect x="720" y="520" width="1080" height="140" fill="url(#floor)"/>
    <line x1="720" y1="520" x2="1800" y2="520" stroke="#D8CFC1" stroke-width="3"/>
    <g stroke="#B08E64" stroke-opacity="0.3" stroke-width="1.2">
      <line x1="720" y1="560" x2="1800" y2="560"/>
      <line x1="720" y1="610" x2="1800" y2="610"/>
    </g>

    <!-- 窗 -->
    <ellipse cx="1500" cy="320" rx="260" ry="200" fill="#FFFBF0" opacity="0.45" filter="url(#soft)"/>
    <rect x="1508" y="140" width="224" height="370" fill="#D8CFC1"/>
    <rect x="1522" y="154" width="196" height="356" fill="url(#sky)"/>
    <g clip-path="url(#win)">
      <ellipse cx="1610" cy="510" rx="120" ry="50" fill="#C9D1BE" opacity="0.6"/>
    </g>
    <rect x="1522" y="154" width="196" height="356" fill="none" stroke="#B89A74" stroke-width="8"/>
    <line x1="1522" y1="290" x2="1718" y2="290" stroke="#B89A74" stroke-width="6"/>

    <!-- 窗帘与风 -->
    <line x1="1480" y1="128" x2="1756" y2="128" stroke="#8B7B66" stroke-width="3"/>
    <path d="M1530,128 C1500,240 1450,360 1400,500 C1420,506 1450,508 1478,504 C1500,380 1530,260 1572,128 Z" fill="#FFFFFF" opacity="0.72"/>
    <path d="M1560,128 C1540,250 1510,370 1478,504 C1490,505 1500,505 1510,503 C1534,380 1566,260 1596,128 Z" fill="#FFFFFF" opacity="0.5"/>
    <g stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round">
      <path d="M1360,300 C1320,292 1290,306 1250,298"/>
      <path d="M1340,360 C1300,352 1260,368 1210,358"/>
    </g>

    <!-- 地面光斑 -->
    <polygon points="1530,522 1712,522 1480,660 1180,660" fill="#FFFCF3" opacity="0.65" filter="url(#soft)"/>

    <!-- 橡木长凳 -->
    <ellipse cx="1110" cy="594" rx="230" ry="10" fill="#7A6A55" opacity="0.25" filter="url(#softS)"/>
    <rect x="930" y="508" width="18" height="84" fill="#A9845A"/>
    <rect x="1272" y="508" width="18" height="84" fill="#A9845A"/>
    <rect x="900" y="486" width="420" height="24" rx="5" fill="#C9A77C"/>
    <rect x="900" y="486" width="420" height="5" rx="2" fill="#DCC09A"/>

    <!-- 陶瓶与枝条 -->
    <g stroke="#6F6A55" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M1007,386 C1000,330 980,290 958,250"/>
      <path d="M1007,386 C1016,330 1040,300 1068,276"/>
    </g>
    <g fill="#9AA58A">
      <ellipse cx="960" cy="256" rx="14" ry="6" transform="rotate(-40 960 256)"/>
      <ellipse cx="978" cy="300" rx="13" ry="5" transform="rotate(30 978 300)"/>
      <ellipse cx="1066" cy="280" rx="14" ry="6" transform="rotate(-30 1066 280)"/>
      <ellipse cx="1036" cy="310" rx="12" ry="5" transform="rotate(20 1036 310)"/>
    </g>
    <path d="M985,488 C975,450 980,420 1000,400 L1000,384 L1014,384 L1014,400 C1034,420 1039,450 1029,488 Z" fill="#EFE9DE"/>
    <path d="M992,470 C988,446 994,424 1004,412" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- 亚麻书本 -->
    <rect x="1120" y="472" width="124" height="14" fill="#D7CDBC"/>
    <rect x="1132" y="460" width="100" height="12" fill="#BFAF96"/>
  </g>
  <text x="720" y="694" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="13" fill="#9A9288">示意插画 · 午后的光与风</text>

  <!-- 三条原则 -->
  <g font-family="'Source Han Sans SC', sans-serif">
    <line x1="720" y1="740" x2="1060" y2="740" stroke="#2A2826" stroke-width="1"/>
    <text x="720" y="790" font-family="Didot, serif" font-size="24" fill="#A88660">i.</text>
    <text x="760" y="790" font-weight="400" font-size="24" fill="#2A2826">自然的材料</text>
    <text font-weight="300" font-size="16" fill="#5E574F">
      <tspan x="720" y="840">原木、石灰、亚麻——</tspan>
      <tspan x="720" y="868">选会随时间变得更好看的材料，</tspan>
      <tspan x="720" y="896">让家与人一起慢慢老去。</tspan>
    </text>

    <line x1="1100" y1="740" x2="1440" y2="740" stroke="#2A2826" stroke-width="1"/>
    <text x="1100" y="790" font-family="Didot, serif" font-size="24" fill="#A88660">ii.</text>
    <text x="1146" y="790" font-weight="400" font-size="24" fill="#2A2826">以光组织空间</text>
    <text font-weight="300" font-size="16" fill="#5E574F">
      <tspan x="1100" y="840">先看朝向，再定格局。</tspan>
      <tspan x="1100" y="868">让自然光决定动线与停留，</tspan>
      <tspan x="1100" y="896">灯光只做温柔的补充。</tspan>
    </text>

    <line x1="1480" y1="740" x2="1800" y2="740" stroke="#2A2826" stroke-width="1"/>
    <text x="1480" y="790" font-family="Didot, serif" font-size="24" fill="#A88660">iii.</text>
    <text x="1532" y="790" font-weight="400" font-size="24" fill="#2A2826">为日常留白</text>
    <text font-weight="300" font-size="16" fill="#5E574F">
      <tspan x="1480" y="840">收纳藏进墙里，台面留给生活。</tspan>
      <tspan x="1480" y="868">空出来的地方，</tspan>
      <tspan x="1480" y="896">是给光、风和家人的。</tspan>
    </text>
  </g>

  <!-- 页脚 -->
  <text x="120" y="1010" font-family="Didot, serif" font-size="18" fill="#2A2826">03 <tspan fill="#B0A89D">/ 09</tspan></text>
  <text x="1800" y="1010" text-anchor="end" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="4" fill="#9A9288">MUYU DESIGN STUDIO</text>
</svg>
