<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="warmWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6DDCF"/>
      <stop offset="1" stop-color="#DDD2C1"/>
    </linearGradient>
    <linearGradient id="limeWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7E1D7"/>
      <stop offset="1" stop-color="#DDD6CA"/>
    </linearGradient>
    <linearGradient id="washWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECE5DA"/>
      <stop offset="1" stop-color="#DCD3C5"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE8C0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE8C0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDBA80"/>
      <stop offset="1" stop-color="#9C7840"/>
    </linearGradient>
    <linearGradient id="oakEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B38B5A"/>
      <stop offset="0.12" stop-color="#DABA8E"/>
      <stop offset="0.3" stop-color="#C9A77C"/>
      <stop offset="1" stop-color="#C29E71"/>
    </linearGradient>
    <pattern id="cane" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#DCC59D"/>
      <path d="M0,6 H12 M6,0 V12" stroke="#B89766" stroke-width="1.4"/>
      <path d="M0,0 L12,12 M12,0 L0,12" stroke="#A98A5E" stroke-width="1"/>
      <circle cx="3" cy="3" r="1.3" fill="#8C6E46" opacity="0.5"/>
      <circle cx="9" cy="9" r="1.3" fill="#8C6E46" opacity="0.5"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="l1"><rect x="720" y="96" width="340" height="320"/></clipPath>
    <clipPath id="l2"><rect x="1090" y="96" width="340" height="320"/></clipPath>
    <clipPath id="l3"><rect x="1460" y="96" width="340" height="320"/></clipPath>
    <clipPath id="d1"><rect x="720" y="620" width="280" height="220"/></clipPath>
    <clipPath id="d2"><rect x="1275" y="620" width="280" height="220"/></clipPath>
    <clipPath id="oakShape"><rect x="60" y="40" width="300" height="220" rx="40"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="#FBFAF7"/>

  <!-- 左栏 -->
  <text x="120" y="150" font-family="'Avenir Next', sans-serif" font-size="16" letter-spacing="6" fill="#8A8278">08 — LIGHTING &amp; DETAILS</text>
  <rect x="120" y="178" width="40" height="1.5" fill="#2A2826"/>
  <text x="118" y="262" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="56" letter-spacing="6" fill="#2A2826">灯具与材质细节</text>

  <text font-family="'Songti SC', serif" font-size="44" fill="#2A2826" letter-spacing="2">
    <tspan x="120" y="400">细节不必被看见，</tspan>
    <tspan x="120" y="466">但会被</tspan>
    <tspan x="120" y="532">每天用到。</tspan>
  </text>
  <rect x="120" y="590" width="60" height="1.5" fill="#A88660"/>

  <text font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="18" fill="#5E574F">
    <tspan x="120" y="650">灯具和收口，是住进去之后才会被注意的部分。</tspan>
    <tspan x="120" y="682">我们偏爱手作与会变老的材料：陶瓷、黄铜、</tspan>
    <tspan x="120" y="714">橡木和藤编，并把光源尽量藏起来，</tspan>
    <tspan x="120" y="746">让人看见光，而不是灯。</tspan>
  </text>

  <text x="120" y="860" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="4" fill="#9A9288">DETAILS · 细节清单</text>
  <text x="120" y="896" font-family="'Source Han Sans SC', sans-serif" font-weight="400" font-size="17" fill="#2A2826">手工陶瓷吊灯 · 黄铜壁灯 · 线性灯带</text>
  <text x="120" y="926" font-family="'Source Han Sans SC', sans-serif" font-weight="400" font-size="17" fill="#2A2826">橡木圆角收口 · 藤编柜门</text>

  <!-- 01 手工陶瓷吊灯 -->
  <g clip-path="url(#l1)">
    <g transform="translate(720,96)">
      <rect width="340" height="320" fill="url(#warmWall)"/>
      <ellipse cx="170" cy="250" rx="160" ry="90" fill="#FFF2D6" opacity="0.65" filter="url(#glow)"/>
      <polygon points="96,206 244,206 310,320 30,320" fill="#FFF4DC" opacity="0.35" filter="url(#soft)"/>
      <line x1="170" y1="0" x2="170" y2="118" stroke="#6E655B" stroke-width="1.5"/>
      <rect x="164" y="112" width="12" height="10" rx="2" fill="#8B7B66"/>
      <path d="M86,202 C88,152 122,121 170,121 C218,121 252,150 256,202 C230,208 200,204 170,207 C140,209 112,206 86,202 Z" fill="#F1ECE2"/>
      <g fill="#D9CFBF">
        <circle cx="130" cy="160" r="1.6"/><circle cx="150" cy="140" r="1.2"/><circle cx="196" cy="150" r="1.5"/>
        <circle cx="220" cy="176" r="1.3"/><circle cx="112" cy="184" r="1.2"/><circle cx="176" cy="178" r="1.4"/>
        <circle cx="236" cy="192" r="1.1"/><circle cx="160" cy="194" r="1.2"/>
      </g>
      <path d="M100,186 C106,158 128,136 158,128" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.75" stroke-linecap="round"/>
      <ellipse cx="171" cy="204" rx="84" ry="7" fill="#FFF6E2"/>
    </g>
  </g>

  <!-- 02 黄铜壁灯 -->
  <g clip-path="url(#l2)">
    <g transform="translate(1090,96)">
      <rect width="340" height="320" fill="url(#limeWall)"/>
      <ellipse cx="70" cy="70" rx="80" ry="40" fill="#EEE9E0" opacity="0.8" filter="url(#soft)"/>
      <ellipse cx="270" cy="260" rx="90" ry="40" fill="#D6CEC1" opacity="0.6" filter="url(#soft)"/>
      <ellipse cx="193" cy="150" rx="90" ry="60" fill="#FFEACB" opacity="0.4" filter="url(#glow)"/>
      <ellipse cx="193" cy="262" rx="100" ry="66" fill="#FFE6B8" opacity="0.6" filter="url(#glow)"/>
      <ellipse cx="114" cy="160" rx="22" ry="5" fill="#7A6A55" opacity="0.2" filter="url(#softS)"/>
      <circle cx="110" cy="150" r="20" fill="url(#brass)"/>
      <circle cx="110" cy="150" r="13" fill="none" stroke="#E8CC98" stroke-width="1" opacity="0.7"/>
      <line x1="110" y1="150" x2="193" y2="150" stroke="url(#brass)" stroke-width="6" stroke-linecap="round"/>
      <line x1="118" y1="148" x2="186" y2="148" stroke="#F2DDB2" stroke-width="1.5" opacity="0.8"/>
      <circle cx="193" cy="151" r="5" fill="#B38D52"/>
      <line x1="193" y1="151" x2="193" y2="158" stroke="#9C7840" stroke-width="3"/>
      <path d="M172,158 L214,158 L226,208 L160,208 Z" fill="url(#brass)"/>
      <path d="M178,162 L170,204" stroke="#F2DDB2" stroke-width="2" opacity="0.7"/>
      <ellipse cx="193" cy="208" rx="33" ry="5" fill="#FFF3D6"/>
    </g>
  </g>

  <!-- 03 隐藏式线性灯带 -->
  <g clip-path="url(#l3)">
    <g transform="translate(1460,96)">
      <rect width="340" height="320" fill="url(#washWall)"/>
      <rect width="340" height="58" fill="#CFC6B8"/>
      <rect y="52" width="340" height="6" fill="#BDB3A4"/>
      <rect y="58" width="340" height="170" fill="url(#wash)"/>
      <rect y="54" width="340" height="18" fill="#FFF0D2" opacity="0.7" filter="url(#softS)"/>
      <line x1="0" y1="59" x2="340" y2="59" stroke="#FFF6E4" stroke-width="2.5"/>
      <ellipse cx="134" cy="240" rx="90" ry="6" fill="#7A6A55" opacity="0.18" filter="url(#softS)"/>
      <rect x="48" y="226" width="170" height="10" rx="2" fill="#C29D70"/>
      <rect x="48" y="226" width="170" height="3" rx="1.5" fill="#D8BA92"/>
      <path d="M82,226 C76,206 80,190 92,184 L92,176 L100,176 L100,184 C112,190 116,206 110,226 Z" fill="#EFE9DE"/>
      <rect x="146" y="212" width="54" height="14" fill="#BFAF96"/>
      <rect x="152" y="202" width="42" height="10" fill="#D7CDBC"/>
      <rect x="214" y="240" width="108" height="66" fill="#FBFAF7" opacity="0.92"/>
      <g stroke="#5E574F" stroke-width="1.5" fill="none">
        <path d="M226,254 H306"/>
        <path d="M226,254 V272 H276"/>
        <path d="M306,254 V302"/>
      </g>
      <circle cx="288" cy="266" r="3.5" fill="#F2C878"/>
      <g stroke="#E8B95E" stroke-width="1" opacity="0.8">
        <line x1="290" y1="270" x2="304" y2="292"/>
        <line x1="288" y1="271" x2="298" y2="296"/>
      </g>
      <text x="226" y="296" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="11" fill="#7D756B">剖面示意</text>
    </g>
  </g>

  <!-- 上排文字 -->
  <g font-family="'Source Han Sans SC', sans-serif">
    <line x1="720" y1="432" x2="1060" y2="432" stroke="#2A2826" stroke-width="1"/>
    <text x="720" y="470" font-family="Didot, serif" font-size="20" fill="#A88660">01</text>
    <text x="756" y="470" font-weight="400" font-size="22" fill="#2A2826">手工陶瓷吊灯</text>
    <text x="720" y="498" font-family="'Avenir Next', sans-serif" font-size="12" letter-spacing="2" fill="#9A9288">HANDMADE CERAMIC PENDANT</text>
    <text font-weight="300" font-size="15" fill="#5E574F">
      <tspan x="720" y="536">釉面带着手作的起伏，</tspan>
      <tspan x="720" y="562">暖光从下沿漫出，落在桌面上。</tspan>
    </text>

    <line x1="1090" y1="432" x2="1430" y2="432" stroke="#2A2826" stroke-width="1"/>
    <text x="1090" y="470" font-family="Didot, serif" font-size="20" fill="#A88660">02</text>
    <text x="1126" y="470" font-weight="400" font-size="22" fill="#2A2826">黄铜壁灯</text>
    <text x="1090" y="498" font-family="'Avenir Next', sans-serif" font-size="12" letter-spacing="2" fill="#9A9288">BRASS WALL LAMP</text>
    <text font-weight="300" font-size="15" fill="#5E574F">
      <tspan x="1090" y="536">黄铜会随时间慢慢变深，</tspan>
      <tspan x="1090" y="562">小小一盏，只照亮墙面的一角。</tspan>
    </text>

    <line x1="1460" y1="432" x2="1800" y2="432" stroke="#2A2826" stroke-width="1"/>
    <text x="1460" y="470" font-family="Didot, serif" font-size="20" fill="#A88660">03</text>
    <text x="1496" y="470" font-weight="400" font-size="22" fill="#2A2826">隐藏式线性灯带</text>
    <text x="1460" y="498" font-family="'Avenir Next', sans-serif" font-size="12" letter-spacing="2" fill="#9A9288">CONCEALED LINEAR LIGHT</text>
    <text font-weight="300" font-size="15" fill="#5E574F">
      <tspan x="1460" y="536">灯具藏进吊顶的缝隙里，</tspan>
      <tspan x="1460" y="562">只留下洗墙的光，不见光源。</tspan>
    </text>
  </g>

  <!-- 04 橡木圆角收口 -->
  <g clip-path="url(#d1)">
    <g transform="translate(720,620)">
      <rect width="280" height="220" fill="#EEE8DE"/>
      <ellipse cx="80" cy="60" rx="90" ry="60" fill="#FFFFFF" opacity="0.4" filter="url(#soft)"/>
      <rect x="60" y="40" width="300" height="220" rx="40" fill="url(#oakEdge)"/>
      <g clip-path="url(#oakShape)" stroke="#9F7A50" stroke-opacity="0.32" stroke-width="1.4" fill="none">
        <path d="M60,78 C120,72 180,88 300,80"/>
        <path d="M60,104 C140,112 200,96 300,108"/>
        <path d="M60,132 C130,126 170,144 200,140 C230,134 260,146 300,138"/>
        <path d="M60,162 C140,170 220,154 300,166"/>
        <path d="M60,194 C120,188 200,202 300,192"/>
        <ellipse cx="200" cy="140" rx="18" ry="5"/>
      </g>
      <path d="M62,80 A38,38 0 0 1 100,42" stroke="#F3E2C6" stroke-width="3" fill="none" opacity="0.8"/>
      <path d="M44,80 A56,56 0 0 1 100,24" stroke="#8A7A66" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
      <circle cx="44" cy="80" r="2.5" fill="#8A7A66"/>
      <circle cx="100" cy="24" r="2.5" fill="#8A7A66"/>
    </g>
  </g>

  <!-- 05 藤编柜门 -->
  <g clip-path="url(#d2)">
    <g transform="translate(1275,620)">
      <rect width="280" height="220" fill="#E9E2D6"/>
      <ellipse cx="60" cy="40" rx="90" ry="50" fill="#FFFFFF" opacity="0.4" filter="url(#soft)"/>
      <rect x="40" y="24" width="200" height="210" rx="6" fill="#C29D70"/>
      <rect x="58" y="42" width="164" height="192" fill="url(#cane)"/>
      <rect x="58" y="42" width="164" height="192" fill="none" stroke="#A9845A" stroke-width="2"/>
      <rect x="40" y="24" width="200" height="4" rx="2" fill="#D8BA92"/>
      <circle cx="231" cy="124" r="5" fill="url(#brass)"/>
      <rect x="250" y="24" width="200" height="210" rx="6" fill="#C29D70"/>
      <rect x="268" y="42" width="164" height="192" fill="url(#cane)"/>
      <rect x="250" y="24" width="200" height="4" rx="2" fill="#D8BA92"/>
    </g>
  </g>

  <!-- 下排文字 -->
  <g font-family="'Source Han Sans SC', sans-serif">
    <text x="1030" y="658" font-family="Didot, serif" font-size="20" fill="#A88660">04</text>
    <text x="1066" y="658" font-weight="400" font-size="22" fill="#2A2826">橡木圆角收口</text>
    <text x="1030" y="686" font-family="'Avenir Next', sans-serif" font-size="12" letter-spacing="2" fill="#9A9288">OAK ROUNDED EDGES</text>
    <line x1="1030" y1="708" x2="1245" y2="708" stroke="#E2DCD2" stroke-width="1"/>
    <text font-weight="300" font-size="15" fill="#5E574F">
      <tspan x="1030" y="744">柜体与台面的转角</tspan>
      <tspan x="1030" y="770">一律打磨成圆角，</tspan>
      <tspan x="1030" y="796">孩子跑过也不怕磕碰。</tspan>
    </text>

    <text x="1585" y="658" font-family="Didot, serif" font-size="20" fill="#A88660">05</text>
    <text x="1621" y="658" font-weight="400" font-size="22" fill="#2A2826">藤编柜门</text>
    <text x="1585" y="686" font-family="'Avenir Next', sans-serif" font-size="12" letter-spacing="2" fill="#9A9288">RATTAN CABINET DOORS</text>
    <line x1="1585" y1="708" x2="1800" y2="708" stroke="#E2DCD2" stroke-width="1"/>
    <text font-weight="300" font-size="15" fill="#5E574F">
      <tspan x="1585" y="744">藤编透气，适合收纳</tspan>
      <tspan x="1585" y="770">衣物与干货，</tspan>
      <tspan x="1585" y="796">也让大面柜体轻下来。</tspan>
    </text>
  </g>

  <text x="720" y="880" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="13" fill="#9A9288">示意插画 · 灯具与收口细节，可替换为项目实拍</text>

  <!-- 页脚 -->
  <text x="120" y="1010" font-family="Didot, serif" font-size="18" fill="#2A2826">08 <tspan fill="#B0A89D">/ 09</tspan></text>
  <text x="1800" y="1010" text-anchor="end" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="4" fill="#9A9288">MUYU DESIGN STUDIO</text>
</svg>
