    <text x="960" y="695" font-weight="300" font-size="17" fill="#5E574F">水磨石台面 · 橡木柜体</text>
    <rect x="1460" y="687" width="220" height="6" fill="#EFEAE1"/>
    <rect x="1460" y="687" width="156" height="6" fill="#CFC6B8"/>
    <text x="1800" y="696" text-anchor="end" fill="#2A2826"><tspan font-family="Didot, serif" font-size="22">27</tspan><tspan font-weight="300" font-size="15" dx="2">㎡</tspan></text>
    <line x1="720" y1="716" x2="1800" y2="716" stroke="#E2DCD2" stroke-width="1"/>

    <text x="720" y="746" font-family="Didot, serif" font-size="20" fill="#A88660">03</text>
    <text x="780" y="746" font-weight="400" font-size="20" fill="#2A2826">主卧</text>
    <text x="960" y="745" font-weight="300" font-size="17" fill="#5E574F">亚麻墙布 · 胡桃木床头</text>
    <rect x="1460" y="737" width="220" height="6" fill="#EFEAE1"/>
    <rect x="1460" y="737" width="139" height="6" fill="#D8CDBA"/>
    <text x="1800" y="746" text-anchor="end" fill="#2A2826"><tspan font-family="Didot, serif" font-size="22">24</tspan><tspan font-weight="300" font-size="15" dx="2">㎡</tspan></text>
    <line x1="720" y1="766" x2="1800" y2="766" stroke="#E2DCD2" stroke-width="1"/>

    <text x="720" y="796" font-family="Didot, serif" font-size="20" fill="#A88660">04</text>
    <text x="780" y="796" font-weight="400" font-size="20" fill="#2A2826">书房</text>
    <text x="960" y="795" font-weight="300" font-size="17" fill="#5E574F">橡木书架 · 藤编</text>
    <rect x="1460" y="787" width="220" height="6" fill="#EFEAE1"/>
    <rect x="1460" y="787" width="75" height="6" fill="#C9A77C"/>
    <text x="1800" y="796" text-anchor="end" fill="#2A2826"><tspan font-family="Didot, serif" font-size="22">13</tspan><tspan font-weight="300" font-size="15" dx="2">㎡</tspan></text>
    <line x1="720" y1="816" x2="1800" y2="816" stroke="#E2DCD2" stroke-width="1"/>

