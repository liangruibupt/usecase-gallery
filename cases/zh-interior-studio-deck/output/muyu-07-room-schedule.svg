    <text x="960" y="645" font-weight="300" font-size="17" fill="#5E574F">白橡木地板 · 微水泥墙面</text>
    <rect x="1460" y="637" width="220" height="6" fill="#EFEAE1"/>
    <rect x="1460" y="637" width="220" height="6" fill="#D2B68F"/>
    <text x="1800" y="646" text-anchor="end" fill="#2A2826"><tspan font-family="Didot, serif" font-size="22">38</tspan><tspan font-weight="300" font-size="15" dx="2">㎡</tspan></text>
    <line x1="720" y1="666" x2="1800" y2="666" stroke="#E2DCD2" stroke-width="1"/>

    <text x="720" y="696" font-family="Didot, serif" font-size="20" fill="#A88660">02</text>
