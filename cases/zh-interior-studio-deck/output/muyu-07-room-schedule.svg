    <circle cx="1640" cy="183" r="8"/>
    <circle cx="1640" cy="267" r="8"/>
    <circle cx="1598" cy="225" r="8"/>
    <circle cx="1682" cy="225" r="8"/>
    <rect x="1520" y="300" width="180" height="30" rx="6"/>
    <rect x="1560" y="346" width="100" height="30" rx="15"/>
    <circle cx="1490" cy="362" r="14"/>
    <rect x="812" y="300" width="22" height="58" fill="#EFE8DC"/>
    <rect x="896" y="440" width="52" height="18" fill="#E3D6BF"/>
  </g>
  <circle cx="1690" cy="440" r="13" fill="#A3AD93"/>
  <circle cx="1662" cy="446" r="9" fill="#8E9B80"/>
  <circle cx="990" cy="442" r="10" fill="#A3AD93"/>

