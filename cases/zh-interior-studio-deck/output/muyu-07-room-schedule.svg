    <text x="1200" y="372" font-weight="300" font-size="13" fill="#7D756B">38㎡</text>
    <text x="1420" y="226" font-weight="400" font-size="17" fill="#2A2826"><tspan font-family="Didot, serif" font-size="15" fill="#A88660">02 </tspan>餐厨</text>
    <text x="1420" y="250" font-weight="300" font-size="13" fill="#7D756B">27㎡</text>
    <text x="1010" y="196" font-weight="400" font-size="17" fill="#2A2826"><tspan font-family="Didot, serif" font-size="15" fill="#A88660">03 </tspan>主卧</text>
    <text x="1010" y="220" font-weight="300" font-size="13" fill="#7D756B">24㎡</text>
    <text x="1158" y="238" font-weight="400" font-size="17" fill="#2A2826"><tspan font-family="Didot, serif" font-size="15" fill="#A88660">04 </tspan>书房</text>
    <text x="1158" y="260" font-weight="300" font-size="13" fill="#7D756B">13㎡</text>
    <text x="888" y="322" font-weight="400" font-size="17" fill="#2A2826"><tspan font-family="Didot, serif" font-size="15" fill="#A88660">05 </tspan>玄关</text>
    <text x="888" y="344" font-weight="300" font-size="13" fill="#7D756B">6㎡</text>
    <text x="1200" y="446" font-weight="400" font-size="17" fill="#2A2826"><tspan font-family="Didot, serif" font-size="15" fill="#A88660">06 </tspan>阳台<tspan font-weight="300" font-size="13" fill="#7D756B">　15㎡</tspan></text>
  </g>

  <!-- 指北针 -->
  <circle cx="1760" cy="156" r="16" fill="none" stroke="#9A9288" stroke-width="1"/>
  <polygon points="1760,141 1766,162 1760,157 1754,162" fill="#2A2826"/>
  <text x="1760" y="190" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11" letter-spacing="1" fill="#7D756B">N</text>

  <text x="720" y="530" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="13" fill="#9A9288">示意插画 · 西溪 · 栖光住宅平面，非实际比例</text>

  <!-- 空间清单表 -->
  <line x1="720" y1="560" x2="1800" y2="560" stroke="#2A2826" stroke-width="1.5"/>
  <g font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="13" letter-spacing="2" fill="#9A9288">
    <text x="720" y="592">编号</text>
    <text x="780" y="592">空间</text>
    <text x="960" y="592">主要材料</text>
    <text x="1460" y="592">面积占比</text>
    <text x="1800" y="592" text-anchor="end">面积</text>
  </g>
  <line x1="720" y1="608" x2="1800" y2="608" stroke="#E2DCD2" stroke-width="1"/>

