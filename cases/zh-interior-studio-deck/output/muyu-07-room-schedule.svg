    <line x1="1050" y1="290" x2="1180" y2="290"/>
    <line x1="1230" y1="290" x2="1260" y2="290"/>
    <line x1="1080" y1="130" x2="1080" y2="290"/>
    <line x1="1260" y1="130" x2="1260" y2="290"/>
    <line x1="960" y1="290" x2="960" y2="310"/>
