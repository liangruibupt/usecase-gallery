<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="oakP" width="48" height="12" patternUnits="userSpaceOnUse">
      <rect width="48" height="12" fill="#EADBC2"/>
      <line x1="0" y1="11.5" x2="48" y2="11.5" stroke="#DBC7A6" stroke-width="1"/>
      <line x1="30" y1="0" x2="30" y2="12" stroke="#DBC7A6" stroke-width="1"/>
    </pattern>
    <pattern id="terrazzoP" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#EEEAE3"/>
      <circle cx="5" cy="6" r="1.6" fill="#C9B9A2"/>
      <circle cx="18" cy="4" r="1.2" fill="#9AA58A"/>
      <circle cx="12" cy="16" r="1.8" fill="#B9A58A"/>
      <circle cx="23" cy="20" r="1.3" fill="#9A9288"/>
      <circle cx="4" cy="23" r="1.2" fill="#C9B9A2"/>
    </pattern>
    <pattern id="linenP" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ECE4D6"/>
      <rect y="2" width="6" height="1" fill="#E0D6C5"/>
      <rect x="2" width="1" height="6" fill="#F2ECE1"/>
    </pattern>
    <pattern id="deckP" width="16" height="60" patternUnits="userSpaceOnUse">
      <rect width="16" height="60" fill="#D6BE98"/>
      <line x1="15.5" y1="0" x2="15.5" y2="60" stroke="#BFA27C" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FBFAF7"/>

  <!-- 左栏 -->
  <text x="120" y="150" font-family="'Avenir Next', sans-serif" font-size="16" letter-spacing="6" fill="#8A8278">07 — ROOM SCHEDULE</text>
  <rect x="120" y="178" width="40" height="1.5" fill="#2A2826"/>
  <text x="118" y="262" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="56" letter-spacing="6" fill="#2A2826">空间清单</text>

  <text font-family="'Songti SC', serif" font-size="44" fill="#2A2826" letter-spacing="2">
    <tspan x="120" y="400">每一平方米，</tspan>
    <tspan x="120" y="466">都先想好</tspan>
    <tspan x="120" y="532">留给谁。</tspan>
  </text>
  <rect x="120" y="590" width="60" height="1.5" fill="#A88660"/>

  <text font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="18" fill="#5E574F">
    <tspan x="120" y="650">西溪 · 栖光住宅是一套三口之家的旧房改造，</tspan>
    <tspan x="120" y="682">总面积 123㎡，划分为六个空间。</tspan>
    <tspan x="120" y="714">客厅与餐厨连成一片，光从阳台一路走进来；</tspan>
    <tspan x="120" y="746">收纳集中在玄关与书房，卧室只留下安睡。</tspan>
  </text>

  <text x="120" y="848" font-family="'Avenir Next', sans-serif" font-size="13" letter-spacing="4" fill="#9A9288">PROJECT DATA · 项目数据</text>
  <text x="120" y="910" fill="#2A2826"><tspan font-family="Didot, serif" font-size="44">123</tspan><tspan font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="20" dx="4">㎡</tspan></text>
  <text x="120" y="940" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="14" fill="#7D756B">总面积</text>
  <text x="300" y="910" font-family="Didot, serif" font-size="44" fill="#2A2826">6</text>
  <text x="300" y="940" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="14" fill="#7D756B">个空间</text>
  <text x="430" y="910" font-family="Didot, serif" font-size="44" fill="#2A2826">3</text>
  <text x="430" y="940" font-family="'Source Han Sans SC', sans-serif" font-weight="300" font-size="14" fill="#7D756B">口之家</text>

  <!-- 右栏：平面示意 -->
  <rect x="720" y="96" width="1080" height="404" fill="#F3EFE8"/>

  <!-- 房间铺装 -->
  <rect x="800" y="130" width="280" height="160" fill="url(#linenP)"/>
  <rect x="1080" y="130" width="180" height="160" fill="url(#oakP)"/>
  <rect x="1260" y="130" width="460" height="160" fill="url(#terrazzoP)"/>
  <rect x="800" y="290" width="160" height="180" fill="#E8E2D7"/>
  <rect x="960" y="290" width="760" height="120" fill="url(#oakP)"/>
  <rect x="960" y="410" width="760" height="60" fill="url(#deckP)"/>

