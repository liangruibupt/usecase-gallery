<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000">
<defs>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
<filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="bPurple" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="5" fill="#7B4DFF"/></pattern>
<pattern id="pMint" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="3" fill="#36E2B4"/></pattern>
<pattern id="pGray" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="3" fill="#A6A6B4"/></pattern>
<radialGradient id="gSc" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#FFF4F4"/><stop offset=".55" stop-color="#FF9DAD"/><stop offset="1" stop-color="#EE3352"/></radialGradient>
<radialGradient id="gF" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#E8B36A"/><stop offset=".55" stop-color="#C27532"/><stop offset="1" stop-color="#8A4416"/></radialGradient>
<g id="scut">
<path d="M0,-38C28,-46 50,-22 42,10C34,40 12,58 0,62C-12,58 -34,40 -42,10C-50,-22 -28,-46 0,-38Z" fill="#C9102B"/>
<path d="M0,-38C28,-46 50,-22 42,10C34,40 12,58 0,62C-12,58 -34,40 -42,10C-50,-22 -28,-46 0,-38Z" transform="translate(0,3) scale(.86)" fill="url(#gSc)"/>
<path d="M0,-24C9,-8 9,22 0,44C-9,22 -9,-8 0,-24Z" fill="#FFFBF7" opacity=".9"/>
<g stroke="#FFF6F6" stroke-width="2" fill="none" opacity=".75" stroke-linecap="round"><path d="M-3,-10Q-16,-22 -30,-26"/><path d="M3,-10Q16,-22 30,-26"/><path d="M-5,6Q-22,2 -36,6"/><path d="M5,6Q22,2 36,6"/><path d="M-4,22Q-16,30 -26,36"/><path d="M4,22Q16,30 26,36"/></g>
<g fill="#FFE7A0"><circle cx="-34" cy="-14" r="1.6"/><circle cx="34" cy="-14" r="1.6"/><circle cx="-38" cy="10" r="1.6"/><circle cx="38" cy="10" r="1.6"/><circle cx="-26" cy="36" r="1.6"/><circle cx="26" cy="36" r="1.6"/><circle cx="0" cy="56" r="1.6"/></g>
<g fill="#fff" opacity=".4"><circle cx="-20" cy="-6" r="2"/><circle cx="18" cy="-2" r="1.5"/><circle cx="-14" cy="18" r="1.6"/><circle cx="16" cy="16" r="2.2"/><circle cx="-24" cy="-22" r="1.4"/><circle cx="22" cy="-20" r="1.8"/></g>
<ellipse cx="-18" cy="-18" rx="8" ry="14" fill="#fff" opacity=".35" filter="url(#soft)"/>
</g>
<!-- 油炸草莓片示意：同形切片，焦糖化变色 -->
<g id="fried">
<path d="M0,-38C28,-46 50,-22 42,10C34,40 12,58 0,62C-12,58 -34,40 -42,10C-50,-22 -28,-46 0,-38Z" fill="#6A320E"/>
<path d="M0,-38C28,-46 50,-22 42,10C34,40 12,58 0,62C-12,58 -34,40 -42,10C-50,-22 -28,-46 0,-38Z" transform="translate(0,3) scale(.86)" fill="url(#gF)"/>
<path d="M0,-24C9,-8 9,22 0,44C-9,22 -9,-8 0,-24Z" fill="#F0CC8E" opacity=".85"/>
<g stroke="#E9BE80" stroke-width="2" fill="none" opacity=".7" stroke-linecap="round"><path d="M-3,-10Q-16,-22 -30,-26"/><path d="M3,-10Q16,-22 30,-26"/><path d="M-5,6Q-22,2 -36,6"/><path d="M5,6Q22,2 36,6"/><path d="M-4,22Q-16,30 -26,36"/><path d="M4,22Q16,30 26,36"/></g>
<g fill="#D9A35A"><circle cx="-34" cy="-14" r="1.6"/><circle cx="34" cy="-14" r="1.6"/><circle cx="-38" cy="10" r="1.6"/><circle cx="38" cy="10" r="1.6"/><circle cx="-26" cy="36" r="1.6"/><circle cx="26" cy="36" r="1.6"/><circle cx="0" cy="56" r="1.6"/></g>
<g fill="#FFF3D6" opacity=".8"><ellipse cx="-18" cy="-22" rx="8" ry="3.5" transform="rotate(-20 -18 -22)"/><ellipse cx="22" cy="-8" rx="4.5" ry="2.2"/><ellipse cx="-14" cy="24" rx="5" ry="2.2"/></g>
<ellipse cx="-16" cy="-14" rx="9" ry="15" fill="#fff" opacity=".22" filter="url(#soft)"/>
</g>
<g id="flake" stroke="#00C2FF" stroke-width="4" stroke-linecap="round"><line x1="0" y1="-12" x2="0" y2="12"/><line x1="-10.4" y1="-6" x2="10.4" y2="6"/><line x1="-10.4" y1="6" x2="10.4" y2="-6"/></g>
<path id="drop" d="M0,-18C6,-8 12,0 12,7A12,12 0 0 1 -12,7C-12,0 -6,-8 0,-18Z"/>
<polygon id="burst16" points="64,0 42.5,17.6 45.3,45.3 17.6,42.5 0,64 -17.6,42.5 -45.3,45.3 -42.5,17.6 -64,0 -42.5,-17.6 -45.3,-45.3 -17.6,-42.5 0,-64 17.6,-42.5 45.3,-45.3 42.5,-17.6"/>
</defs>

<rect width="750" height="1000" fill="#FFC300"/>
<rect width="750" height="1000" fill="url(#bPurple)" opacity=".3"/>

<!-- 标题 -->
<g font-family="Source Han Sans SC, sans-serif" font-weight="900" font-size="88" text-anchor="middle">
<text x="383" y="126" fill="#111">冻干 <tspan font-family="Futura, sans-serif" font-weight="700">VS</tspan> 油炸</text>
<text x="375" y="118" fill="#fff" stroke="#111" stroke-width="12" stroke-linejoin="round" paint-order="stroke">冻干 <tspan font-family="Futura, sans-serif" font-weight="700" fill="#FF3B5C">VS</tspan> 油炸</text>
</g>
<text x="375" y="182" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-weight="800" font-size="30" fill="#111">都是果干，做法不一样</text>

<!-- 左卡：冻干 -->
<rect x="38" y="233" width="335" height="335" rx="14" fill="#111"/>
<rect x="30" y="225" width="335" height="335" rx="14" fill="#fff" stroke="#111" stroke-width="6"/>
<rect x="33" y="295" width="329" height="262" fill="url(#pMint)" opacity=".3"/>
<path d="M33,295V239Q33,228 44,228H351Q362,228 362,239V295Z" fill="#FF3B5C"/>
<line x1="30" y1="295" x2="365" y2="295" stroke="#111" stroke-width="6"/>
<text x="197" y="273" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-weight="900" font-size="34" fill="#fff" stroke="#111" stroke-width="5" paint-order="stroke">脆滋滋 · 冻干</text>
<use href="#scut" transform="translate(190,420) scale(1.9)" filter="url(#sh)"/>
<use href="#flake" transform="translate(72,330)"/>
<use href="#flake" transform="translate(318,345) scale(.8)"/>
<use href="#flake" transform="translate(70,515) scale(.7)"/>

<!-- 右卡：油炸 -->
<rect x="393" y="233" width="335" height="335" rx="14" fill="#111"/>
<rect x="385" y="225" width="335" height="335" rx="14" fill="#E9E9EF" stroke="#111" stroke-width="6"/>
<rect x="388" y="295" width="329" height="262" fill="url(#pGray)" opacity=".35"/>
<path d="M388,295V239Q388,228 399,228H706Q717,228 717,239V295Z" fill="#8E8E9E"/>
<line x1="385" y1="295" x2="720" y2="295" stroke="#111" stroke-width="6"/>
<text x="552" y="273" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-weight="900" font-size="34" fill="#fff" stroke="#111" stroke-width="5" paint-order="stroke">油炸果干</text>
<ellipse cx="560" cy="530" rx="108" ry="12" fill="#FFC300" opacity=".5"/>
<use href="#fried" transform="translate(560,415) rotate(6) scale(1.8)" filter="url(#sh)"/>
<g fill="#FFD54A" stroke="#111" stroke-width="3" stroke-linejoin="round">
<use href="#drop" transform="translate(470,345)"/>
<use href="#drop" transform="translate(672,372) scale(.85)"/>
<use href="#drop" transform="translate(680,500) scale(.7)"/>
</g>
<g stroke="#8E8E9E" stroke-width="4" fill="none" stroke-linecap="round">
<path d="M520,332q-6,-8 0,-16q6,-8 0,-16"/><path d="M600,326q-6,-8 0,-16q6,-8 0,-16"/>
</g>

<!-- VS -->
<g transform="translate(375,415)">
<use href="#burst16" transform="translate(6,6) scale(1.12)" fill="#111"/>
<use href="#burst16" transform="scale(1.12)" fill="#36E2B4" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
<text x="0" y="18" text-anchor="middle" font-family="Futura, sans-serif" font-weight="700" font-size="50" fill="#FF3B5C" stroke="#111" stroke-width="4" paint-order="stroke">VS</text>
</g>

<!-- 对比行 -->
<g font-family="Source Han Sans SC, sans-serif" text-anchor="middle">
<rect x="30" y="611" width="335" height="66" fill="#fff" stroke="#111" stroke-width="5"/>
<rect x="385" y="611" width="335" height="66" fill="#EDEDF2" stroke="#111" stroke-width="5"/>
<rect x="295" y="595" width="160" height="36" rx="18" fill="#111"/>
<text x="375" y="621" font-weight="800" font-size="22" fill="#FFC300">加工方式</text>
<text x="197" y="659" font-weight="900" font-size="34" fill="#FF3B5C">-40℃ 冻干</text>
<text x="552" y="658" font-weight="700" font-size="30" fill="#555">高温油炸</text>

<rect x="30" y="701" width="335" height="66" fill="#fff" stroke="#111" stroke-width="5"/>
<rect x="385" y="701" width="335" height="66" fill="#EDEDF2" stroke="#111" stroke-width="5"/>
<rect x="295" y="685" width="160" height="36" rx="18" fill="#111"/>
<text x="375" y="711" font-weight="800" font-size="22" fill="#FFC300">是否油炸</text>
<text x="197" y="749" font-weight="900" font-size="34" fill="#FF3B5C">非油炸</text>
<text x="552" y="748" font-weight="700" font-size="30" fill="#555">油炸</text>

<rect x="30" y="791" width="335" height="66" fill="#fff" stroke="#111" stroke-width="5"/>
<rect x="385" y="791" width="335" height="66" fill="#EDEDF2" stroke="#111" stroke-width="5"/>
<rect x="295" y="775" width="160" height="36" rx="18" fill="#111"/>
<text x="375" y="801" font-weight="800" font-size="22" fill="#FFC300">添加糖</text>
<text x="197" y="839" font-weight="900" font-size="34" fill="#FF3B5C">0添加糖</text>
<text x="552" y="838" font-weight="700" font-size="28" fill="#555">视具体产品而定</text>
</g>

<!-- 脚注 -->
<text x="375" y="912" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-weight="500" font-size="22" fill="#111">* 对比为工艺示意，不针对任何具体品牌或产品</text>
<text x="375" y="962" text-anchor="middle" font-family="Futura, sans-serif" font-weight="700" font-size="18" letter-spacing="6" fill="#111">CUIZIZI · FREEZE-DRIED</text>
</svg>
