<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Low Tide: Instagram, new bottle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gloock&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213D; --oyster:#EDE6DA; --kelp:#4E6E4E; --coral:#F2795B;
    --display:'Gloock', Georgia, 'Times New Roman', serif;
    --text:'Work Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono:'DM Mono', ui-monospace, Menlo, Consolas, monospace;
    --l:30px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--oyster);color:var(--navy)}
  body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:var(--text);-webkit-font-smoothing:antialiased}
  .disp{font-family:var(--display);font-weight:400}
  .eyebrow{font-family:var(--mono);font-size:15px;letter-spacing:.08em;text-transform:uppercase}

  .logo{position:absolute;display:inline-flex;flex-direction:column;padding:var(--l);margin:calc(-1 * var(--l));color:inherit;text-decoration:none}
  .logo .word{font-family:var(--display);font-size:40px;line-height:1;letter-spacing:-.005em}
  .logo svg{display:block;width:100%;height:10px;margin-top:5px;overflow:visible}

  .topright{position:absolute;right:80px;top:86px}
  h1{position:absolute;left:76px;top:210px;font-size:104px;line-height:.95;letter-spacing:-.02em}
  .info{position:absolute;left:80px;top:470px;width:500px}
  .info .eyebrow{color:var(--kelp)}
  .grape{font-size:56px;line-height:1;margin-top:14px;letter-spacing:-.01em}
  .region{font-size:24px;font-weight:500;margin-top:16px}
  .taste{font-size:24px;line-height:1.4;margin-top:14px;width:480px}
  .prices{display:flex;gap:44px;margin-top:40px;padding-top:18px;border-top:1.5px solid var(--navy);font-family:var(--mono);font-size:26px}
  .specs{margin-top:46px;font-family:var(--mono);font-size:17px}
  .specs div{height:46px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--navy)}
  .specs dt{text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--kelp)}

  .bottle{position:absolute;left:700px;top:190px;width:280px;height:1000px;z-index:1}
  .sticker{position:absolute;left:874px;top:694px;width:112px;height:112px;border-radius:50%;background:var(--coral);color:var(--navy);z-index:2;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;letter-spacing:.08em;text-transform:uppercase}

  .sea{position:absolute;left:0;top:1066px;width:1080px;height:284px;z-index:3}
  .sea svg.crest{display:block;width:1080px;height:24px}
  .deep{width:1080px;height:260px;background:var(--navy)}
  .deep svg{display:block;width:1080px;height:244px}

  .toggle{position:absolute;top:14px;right:14px;z-index:60;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;background:var(--oyster);color:var(--navy);border:1.5px solid var(--navy);cursor:pointer;opacity:0;transition:opacity .15s}
  .toggle:hover,.toggle:focus-visible,body.notes .toggle{opacity:1}
  #notes-layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none}
  body.notes #notes-layer{display:block}
  body.notes [data-note]{outline:1.5px dashed currentColor;outline-offset:6px}
  body.notes .logo[data-note]{outline-offset:0}
  #leaders{position:absolute;left:0;top:0}
  #notes-layer .ann{position:absolute;width:240px;background:var(--oyster);color:var(--navy);border:1.5px solid var(--navy);padding:10px 13px 12px;font:13px/1.42 var(--text)}
  #notes-layer .ann .k{display:flex;gap:8px;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--kelp);margin-bottom:7px}
  #notes-layer .ann .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--oyster);display:inline-flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:0}
  #notes-layer .ann.sum{width:420px;padding:14px 16px}
  #notes-layer .swatches{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
  #notes-layer .sw{display:flex;align-items:center;gap:6px;font:11px var(--mono);border:1.5px solid var(--navy);padding:3px 7px 3px 3px}
  #notes-layer .sw i{display:block;width:14px;height:14px;border:1.5px solid var(--navy)}
  #notes-layer .meter{display:flex;align-items:center;gap:10px;font:11px var(--mono);margin-top:8px}
  #notes-layer .track{width:150px;height:10px;border:1.5px solid var(--navy);position:relative}
  #notes-layer .fill{position:absolute;left:0;top:0;bottom:0;background:var(--coral)}
</style>
</head>
<body>
<button class="toggle" id="toggle" aria-pressed="false">Notes · off</button>

<a class="logo" href="low-tide-homepage.page.html" style="left:80px;top:72px" data-note="logo" aria-label="low tide">
  <span class="word">low tide</span>
  <svg viewBox="0 0 100 8" preserveAspectRatio="none" aria-hidden="true"><path d="M0 4 Q6.25 0 12.5 4 T25 4 T37.5 4 T50 4 T62.5 4 T75 4 T87.5 4 T100 4" fill="none" stroke="#14213D" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>
</a>
<div class="eyebrow topright">New arrival · No. 07</div>

<h1 class="disp" data-note="h1">Something<br>washed up.</h1>

<div class="info">
  <div class="eyebrow">On the shelf from Thursday</div>
  <div class="grape disp" data-note="grape">Poulsard</div>
  <div class="region">Arbois, Jura, France</div>
  <p class="taste" data-note="taste">Pale enough for rosé people. Serious enough for everyone else.</p>
  <div class="prices" data-note="price"><span>Glass $17</span><span>Bottle $68</span></div>
  <dl class="specs">
    <div><dt>Skin contact</dt><dd>9 days</dd></div>
    <div><dt>Sulfur</dt><dd>None added</dd></div>
    <div><dt>Serve</dt><dd>A little chilled</dd></div>
  </dl>
</div>

<svg class="bottle" viewBox="0 0 280 1000" data-note="bottle" aria-label="Illustration of a wine bottle floating in the tide">
  <path d="M105 50 L175 50 L175 280 C175 340 260 370 260 440 L260 1000 L20 1000 L20 440 C20 370 105 340 105 280 Z" fill="#4E6E4E"/>
  <path d="M102 34 C102 22 110 16 140 16 C170 16 178 22 178 34 L178 150 L102 150 Z" fill="#14213D"/>
  <line x1="50" y1="470" x2="50" y2="960" stroke="#EDE6DA" stroke-width="4" stroke-linecap="round"/>
  <rect x="40" y="560" width="200" height="240" fill="#EDE6DA" stroke="#14213D" stroke-width="1.5"/>
  <text x="140" y="622" text-anchor="middle" font-family="DM Mono, monospace" font-size="20" fill="#14213D" letter-spacing="1">poulsard</text>
  <path d="M95 642 Q102.5 636 110 642 T125 642 T140 642 T155 642 T170 642 T185 642" fill="none" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
  <text x="140" y="680" text-anchor="middle" font-family="DM Mono, monospace" font-size="13" fill="#14213D" letter-spacing="1">arbois · jura</text>
  <text x="140" y="704" text-anchor="middle" font-family="DM Mono, monospace" font-size="13" fill="#14213D" letter-spacing="1">2022</text>
  <g fill="none" stroke="#4E6E4E" stroke-width="1.25" stroke-linecap="round">
    <path d="M56 736 Q66 732 76 736 T96 736 T116 736 T136 736 T156 736 T176 736 T196 736 T216 736 T224 736"/>
    <path d="M56 754 Q66 750 76 754 T96 754 T116 754 T136 754 T156 754 T176 754 T196 754 T216 754 T224 754"/>
    <path d="M56 768 Q66 765 76 768 T96 768 T116 768 T136 768 T156 768 T176 768 T196 768 T216 768 T224 768"/>
    <path d="M56 779 Q66 776.5 76 779 T96 779 T116 779 T136 779 T156 779 T176 779 T196 779 T216 779 T224 779"/>
    <path d="M56 788 Q66 786 76 788 T96 788 T116 788 T136 788 T156 788 T176 788 T196 788 T216 788 T224 788"/>
  </g>
</svg>
<div class="sticker" data-coral="0.785" data-note="sticker">Just in</div>

<div class="sea" data-note="sea">
  <svg class="crest" data-amp="8" data-len="180" data-fill="#14213D" aria-hidden="true"></svg>
  <div class="deep"><svg class="tide" data-n="13" data-r="0.87" data-amp="4" data-len="130" data-sw="1.25" data-stroke="#EDE6DA" aria-hidden="true"></svg></div>
</div>

<div id="notes-layer" aria-hidden="true"><svg id="leaders" width="1080" height="1350"></svg></div>

<script>
window.PIECE={
  W:1080,H:1350,SUM:[600,1160],
  NOTES:[
    {id:'logo',   a:[1,.5], at:[300,56], rule:'Logo', t:`Lowercase wordmark with its wave line. The dashed box is the clear space, the height of the “l” ({L}px).`},
    {id:'h1',     a:[.95,.3], at:[520,128], rule:'Display · voice', t:`Gloock, sentence case. A new bottle “washed up”: dry and short, and it ties back to the tide.`},
    {id:'grape',  a:[1,.5], at:[340,440], rule:'Display', t:`The grape name is set in Gloock, so the wine reads like a headline of its own.`},
    {id:'taste',  a:[1,.3], at:[580,560], rule:'Type · text · voice', t:`Body copy in Work Sans, two lines with one joke.`},
    {id:'price',  a:[.8,.5], at:[340,760], rule:'Type · prices', t:`Prices and specs are DM Mono. The spec labels are in Kelp.`},
    {id:'sticker',a:[1,.3], at:[808,880], rule:'Accent ≤ 10%', t:`A single coral sticker, under 1% of the post.`},
    {id:'bottle', a:[.15,.3], at:[560,1000], rule:'Palette', t:`The bottle is Kelp, the capsule is Navy and the label is Oyster. The bottle is drawn from the four brand colors only.`},
    {id:'sea',    a:[.15,.5], at:[80,1110], rule:'Graphic device', t:`The bottle floats in horizontal tide lines that grow denser toward the bottom. They are never rotated.`}
  ]
};
</script>
<script>
(function(){
  const P=window.PIECE, W=P.W, H=P.H;
  function tidePaths(w,h,o){
    const n=Math.max(2,o.n), ratio=o.r, sw=o.sw, pad=o.amp+sw, usable=h-2*pad;
    const g=[]; let sum=0;
    for(let i=0;i<n-1;i++){const v=Math.pow(ratio,i); g.push(v); sum+=v;}
    const ys=[pad]; let y=pad; g.forEach(v=>{y+=v/sum*usable; ys.push(y);});
    let out='';
    ys.forEach((y0,i)=>{
      const near=Math.min(g[Math.max(0,i-1)], g[Math.min(i,g.length-1)])/sum*usable;
      const a=Math.min(o.amp*(0.7+0.3*Math.sin(i*1.9+0.4)), near*0.42);
      const L=o.len*(1+0.15*Math.sin(i*2.7)), ph=i*0.85;
      let d='';
      for(let x=-6;x<=w+6;x+=4){ d+=(d?'L':'M')+x+' '+(y0+a*Math.sin(2*Math.PI*x/L+ph)).toFixed(2); }
      out+=`<path d="${d}" fill="none" stroke="${o.stroke}" stroke-width="${sw}" stroke-linecap="round"/>`;
    });
    return out;
  }
  function crest(w,h,amp,len,fill){
    let d=`M0 ${h}`;
    for(let x=0;x<=w;x+=4){ d+=` L${x} ${(amp+amp*Math.sin(2*Math.PI*x/len+0.6)).toFixed(2)}`; }
    return `<path d="${d} L${w} ${h} Z" fill="${fill}"/>`;
  }
  function draw(){
    document.querySelectorAll('svg.tide').forEach(svg=>{
      const r=svg.getBoundingClientRect(), w=Math.round(r.width), h=Math.round(r.height), d=svg.dataset;
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      svg.innerHTML=tidePaths(w,h,{n:+d.n,r:+d.r,amp:+d.amp,len:+d.len,sw:+d.sw,stroke:d.stroke});
    });
    document.querySelectorAll('svg.crest').forEach(svg=>{
      const r=svg.getBoundingClientRect(), w=Math.round(r.width), h=Math.round(r.height), d=svg.dataset;
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      svg.innerHTML=crest(w,h,+d.amp,+d.len,d.fill);
    });
    if(P.draw) P.draw();
  }
  function measureL(){
    const word=document.querySelector('.logo .word');
    const fs=parseFloat(getComputedStyle(word).fontSize);
    const c=document.createElement('canvas').getContext('2d');
    c.font=`${fs}px Gloock, Georgia, serif`;
    const m=c.measureText('l');
    const lh=Math.round(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent)||Math.round(fs*.75);
    document.documentElement.style.setProperty('--l',lh+'px');
    return lh;
  }
  function coralShare(){
    let area=0;
    document.querySelectorAll('[data-coral]').forEach(el=>{const r=el.getBoundingClientRect(); area+=r.width*r.height*(+el.dataset.coral||1);});
    return area/(W*H)*100;
  }
  function build(lh){
    const layer=document.getElementById('notes-layer'), svg=document.getElementById('leaders');
    layer.querySelectorAll('.ann').forEach(n=>n.remove());
    const hidden=!document.body.classList.contains('notes');
    if(hidden) layer.style.display='block';
    const placed=[]; let lines='', pins='';
    const share=coralShare();
    const s=document.createElement('div');
    s.className='ann sum'; s.style.left=P.SUM[0]+'px'; s.style.top=P.SUM[1]+'px';
    s.innerHTML=`<div class="k">Annotations · ${P.NOTES.length} notes · press N</div>
      <div>Only the guideline palette and type are used.</div>
      <div class="swatches">
        <span class="sw"><i style="background:#14213D"></i>Tide Navy #14213D</span>
        <span class="sw"><i style="background:#EDE6DA"></i>Oyster #EDE6DA</span>
        <span class="sw"><i style="background:#4E6E4E"></i>Kelp #4E6E4E</span>
        <span class="sw"><i style="background:#F2795B"></i>Sunset Coral #F2795B</span>
      </div>
      <div style="font:11px var(--mono)">Gloock display · Work Sans text · DM Mono prices &amp; labels</div>
      <div class="meter"><span>Coral ≈ ${share.toFixed(2)}%</span><span class="track"><span class="fill" style="width:${Math.min(100,share*10)}%"></span></span><span>10% cap</span></div>`;
    layer.appendChild(s);
    placed.push({x:P.SUM[0],y:P.SUM[1],w:s.offsetWidth,h:s.offsetHeight});
    P.NOTES.forEach((n,i)=>{
      const el=document.querySelector(`[data-note="${n.id}"]`);
      if(!el) return;
      const r=el.getBoundingClientRect();
      const ax=r.left+n.a[0]*r.width, ay=r.top+n.a[1]*r.height;
      const card=document.createElement('div');
      card.className='ann';
      card.innerHTML=`<div class="k"><span class="num">${i+1}</span>${n.rule}</div>${n.t.replace('{L}',lh)}`;
      layer.appendChild(card);
      const w=card.offsetWidth, h=card.offsetHeight;
      let x=Math.max(12,Math.min(W-w-12,n.at[0])), y=n.at[1];
      let moved=true, guard=0;
      while(moved && guard++<30){
        moved=false;
        for(const p of placed){
          if(x<p.x+p.w+8 && x+w+8>p.x && y<p.y+p.h+8 && y+h+8>p.y){ y=p.y+p.h+10; moved=true; }
        }
      }
      y=Math.min(y,H-h-12);
      card.style.left=x+'px'; card.style.top=y+'px';
      placed.push({x,y,w,h});
      const cx=Math.max(x,Math.min(x+w,ax)), cy=Math.max(y,Math.min(y+h,ay));
      lines+=`<line x1="${ax}" y1="${ay}" x2="${cx}" y2="${cy}" stroke="#EDE6DA" stroke-width="4"/><line x1="${ax}" y1="${ay}" x2="${cx}" y2="${cy}" stroke="#14213D" stroke-width="1.5"/>`;
      pins+=`<circle cx="${ax}" cy="${ay}" r="10" fill="#14213D" stroke="#EDE6DA" stroke-width="2"/><text x="${ax}" y="${ay+3.5}" text-anchor="middle" font-family="DM Mono, monospace" font-size="10" fill="#EDE6DA">${i+1}</text>`;
    });
    svg.innerHTML=lines+pins;
    if(hidden) layer.style.display='';
  }
  function setNotes(on){
    document.body.classList.toggle('notes',on);
    const b=document.getElementById('toggle');
    b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'Notes · on':'Notes · off';
  }
  function init(){ const lh=measureL(); draw(); requestAnimationFrame(()=>build(lh)); }
  document.getElementById('toggle').addEventListener('click',()=>setNotes(!document.body.classList.contains('notes')));
  document.addEventListener('keydown',e=>{ if(e.key==='n'||e.key==='N') setNotes(!document.body.classList.contains('notes')); });
  if(location.hash==='#notes') setNotes(true);
  draw();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(init); } else { init(); }
  setTimeout(init,1500);
})();
</script>
</body>
</html>
