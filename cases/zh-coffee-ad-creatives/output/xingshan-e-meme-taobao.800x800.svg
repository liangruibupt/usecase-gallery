<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="800" viewBox="0 0 800 800">
  <style>
    .hv{font-family:'Source Han Sans SC',sans-serif}
    .pf{font-family:'PingFang SC',sans-serif}
    .gs{font-family:'Gill Sans',sans-serif}
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2.6" fill="#8E0B06" fill-opacity="0.32"/>
    </pattern>
    <path id="ray" d="M0 0 L-55 -600 L55 -600 Z"/>
    <clipPath id="cupClip">
      <path d="M0 0 L200 0 L185 190 Q184 200 174 200 L26 200 Q16 200 15 190 Z"/>
    </clipPath>
    <linearGradient id="cof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9784A"/>
      <stop offset="0.3" stop-color="#6E3B1E"/>
      <stop offset="1" stop-color="#2E1508"/>
    </linearGradient>
    <path id="spark" d="M0 -18 L5 -5 L18 0 L5 5 L0 18 L-5 5 L-18 0 L-5 -5 Z"/>
    <g id="cup">
      <ellipse cx="100" cy="212" rx="96" ry="10" fill="#000" opacity="0.35"/>
      <path d="M0 0 L200 0 L185 190 Q184 200 174 200 L26 200 Q16 200 15 190 Z" fill="#FFFFFF" fill-opacity="0.3"/>
      <g clip-path="url(#cupClip)">
        <rect x="0" y="48" width="200" height="160" fill="url(#cof)"/>
        <ellipse cx="100" cy="48" rx="98" ry="7" fill="#C98A58"/>
        <g fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-width="2.5">
          <rect x="30" y="28" width="42" height="38" rx="7" transform="rotate(-12 51 47)"/>
          <rect x="82" y="32" width="38" height="34" rx="7" transform="rotate(9 101 49)"/>
          <rect x="130" y="26" width="38" height="36" rx="6" transform="rotate(-6 149 44)"/>
        </g>
        <rect x="18" y="0" width="10" height="200" fill="#FFFFFF" opacity="0.3"/>
      </g>
      <g fill="#111111" stroke="#FFFFFF" stroke-width="3">
        <rect x="36" y="86" width="58" height="34" rx="10"/>
        <rect x="106" y="86" width="58" height="34" rx="10"/>
      </g>
      <rect x="92" y="94" width="16" height="7" fill="#111111"/>
      <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85">
        <path d="M48 96 L60 92"/><path d="M118 96 L130 92"/>
      </g>
      <path d="M72 150 Q106 170 138 140" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <path d="M0 0 L200 0 L185 190 Q184 200 174 200 L26 200 Q16 200 15 190 Z" fill="none" stroke="#111111" stroke-width="7" stroke-linejoin="round"/>
      <ellipse cx="100" cy="0" rx="100" ry="10" fill="#FFFFFF" fill-opacity="0.3" stroke="#111111" stroke-width="7"/>
      <g fill="#FFFFFF" stroke="#111111" stroke-width="3.5" stroke-linejoin="round">
        <use xlink:href="#spark" transform="translate(-30 20)"/>
        <use xlink:href="#spark" transform="translate(220 160) scale(0.6)"/>
      </g>
    </g>
    <g id="stamp">
      <rect x="-87" y="-87" width="190" height="190" fill="#111111"/>
      <rect x="-95" y="-95" width="190" height="190" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
      <rect x="-82" y="-82" width="164" height="164" fill="none" stroke="#EE2B1E" stroke-width="4"/>
      <rect x="-76" y="-76" width="152" height="152" fill="none" stroke="#EE2B1E" stroke-width="1.5"/>
      <text y="-40" text-anchor="middle" class="hv" font-weight="900" font-size="26" fill="#EE2B1E" letter-spacing="6">首单</text>
      <text y="24" text-anchor="middle" fill="#EE2B1E"><tspan class="gs" font-weight="700" font-size="70">9.9</tspan><tspan class="hv" font-weight="900" font-size="24" dx="2">元</tspan></text>
      <line x1="-56" y1="38" x2="56" y2="38" stroke="#EE2B1E" stroke-width="2"/>
      <text y="66" text-anchor="middle" class="hv" font-weight="900" font-size="26" fill="#EE2B1E">6 颗</text>
    </g>
  </defs>

  <rect width="800" height="800" fill="#EE2B1E"/>
  <g transform="translate(580 390)" fill="#D81E12">
    <use xlink:href="#ray"/><use xlink:href="#ray" transform="rotate(30)"/><use xlink:href="#ray" transform="rotate(60)"/>
    <use xlink:href="#ray" transform="rotate(90)"/><use xlink:href="#ray" transform="rotate(120)"/><use xlink:href="#ray" transform="rotate(150)"/>
    <use xlink:href="#ray" transform="rotate(180)"/><use xlink:href="#ray" transform="rotate(210)"/><use xlink:href="#ray" transform="rotate(240)"/>
    <use xlink:href="#ray" transform="rotate(270)"/><use xlink:href="#ray" transform="rotate(300)"/><use xlink:href="#ray" transform="rotate(330)"/>
  </g>
  <rect width="800" height="800" fill="url(#dots)"/>

  <!-- logo -->
  <g transform="translate(40 36) scale(0.8)">
    <rect width="56" height="56" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <path d="M10 40 L22 26 L29 33 L38 20 L48 40" stroke="#EE2B1E" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="40" cy="14" r="4" fill="#111111"/>
    <text x="70" y="36" class="hv" font-weight="900" font-size="36" fill="#FFFFFF" letter-spacing="2">醒山</text>
    <text x="71" y="54" class="gs" font-weight="700" font-size="12" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="3">XINGSHAN</text>
  </g>
  <text x="760" y="64" text-anchor="end" class="pf" font-weight="600" font-size="15" fill="#FFFFFF" letter-spacing="1.5">热梗实测 · 打工人自用</text>

  <!-- headline -->
  <g transform="translate(36 196) scale(1 1.12)">
    <text x="6" y="6" class="hv" font-weight="900" font-size="100" fill="#111111">比你回</text>
    <text class="hv" font-weight="900" font-size="100" fill="none" stroke="#111111" stroke-width="10" stroke-linejoin="round">比你回</text>
    <text class="hv" font-weight="900" font-size="100" fill="#FFFFFF">比你回</text>
  </g>
  <g transform="translate(36 316) scale(1 1.12)">
    <text x="6" y="6" class="hv" font-weight="900" font-size="100" fill="#111111">老板消息</text>
    <text class="hv" font-weight="900" font-size="100" fill="none" stroke="#111111" stroke-width="10" stroke-linejoin="round">老板消息</text>
    <text class="hv" font-weight="900" font-size="100" fill="#FFFFFF">老板消息</text>
  </g>
  <g transform="translate(44 470) rotate(-3)">
    <rect x="-2" y="-110" width="318" height="136" fill="#111111"/>
    <rect x="-8" y="-116" width="318" height="136" fill="#FFFFFF" stroke="#111111" stroke-width="4.5"/>
    <g transform="scale(1 1.12)">
      <text x="4" y="0" class="hv" font-weight="900" font-size="100" fill="#111111">还<tspan fill="#EE2B1E">快！</tspan></text>
    </g>
  </g>

  <use xlink:href="#stamp" transform="translate(650 170) rotate(-12) scale(0.85)"/>

  <!-- meme -->
  <use xlink:href="#cup" transform="translate(486 314) scale(0.78)"/>
  <g class="hv" font-weight="900" font-size="30" text-anchor="middle">
    <text x="714" y="382" fill="none" stroke="#111111" stroke-width="7" stroke-linejoin="round">3 秒</text>
    <text x="714" y="382" fill="#FFFFFF">3 秒</text>
    <text x="714" y="420" fill="none" stroke="#111111" stroke-width="7" stroke-linejoin="round">已溶</text>
    <text x="714" y="420" fill="#FFFFFF">已溶</text>
  </g>

  <!-- chat screenshot -->
  <rect x="46" y="504" width="714" height="134" fill="#111111"/>
  <rect x="40" y="498" width="714" height="134" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <circle cx="74" cy="530" r="19" fill="#111111"/>
  <text x="74" y="537" text-anchor="middle" class="pf" font-weight="600" font-size="18" fill="#FFFFFF">板</text>
  <rect x="102" y="512" width="168" height="36" rx="10" fill="#EDEDED"/>
  <text x="116" y="537" class="pf" font-size="20" fill="#111111">方案改完了吗？</text>
  <text x="282" y="536" class="pf" font-size="15" fill="#888888">已读 · 23 分钟未回</text>

  <circle cx="722" cy="598" r="19" fill="#EE2B1E" stroke="#111111" stroke-width="2.5"/>
  <path d="M711 604 L717 597 L721 601 L726 594 L733 604" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="478" y="580" width="216" height="36" rx="10" fill="#111111"/>
  <text x="494" y="605" class="pf" font-weight="600" font-size="20" fill="#FFFFFF">冷水一倒，已溶</text>
  <path d="M651 597 l6 6 l12 -12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="466" y="604" text-anchor="end" class="pf" font-size="15" fill="#888888">用时 <tspan class="gs" font-weight="700" font-size="20" fill="#EE2B1E">3.00 s</tspan></text>

  <!-- selling point -->
  <rect x="40" y="648" width="714" height="44" fill="#111111"/>
  <text x="397" y="679" text-anchor="middle" class="hv" font-weight="900" font-size="26" fill="#FFFFFF">3 秒冷水速溶<tspan font-weight="500" fill="#BBBBBB"> · 0 糖 0 脂</tspan></text>

  <text x="40" y="710" class="pf" font-size="12" fill="#FFFFFF" fill-opacity="0.85">* 冷水搅拌后速溶，图示为示意；梗图仅为趣味表达。</text>

  <!-- CTA -->
  <rect x="46" y="724" width="714" height="56" fill="#111111"/>
  <rect x="40" y="718" width="714" height="56" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <text x="66" y="757" class="hv" font-weight="900" font-size="30" fill="#111111">立即抢购 · 首单 <tspan class="gs" font-weight="700" font-size="34" fill="#EE2B1E">9.9</tspan> 元 6 颗</text>
  <g fill="none" stroke="#EE2B1E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M680 735 l10 11 l-10 11"/><path d="M698 735 l10 11 l-10 11"/><path d="M716 735 l10 11 l-10 11"/>
  </g>
</svg>
