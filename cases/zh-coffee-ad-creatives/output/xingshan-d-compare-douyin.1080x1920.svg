<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <style>
    .hg{font-family:'Hiragino Sans GB',sans-serif}
    .av{font-family:'Avenir Next',sans-serif}
  </style>
  <defs>
    <clipPath id="glassClip">
      <path d="M0 0 L200 0 L184 250 Q183 260 172 260 L28 260 Q17 260 16 250 Z"/>
    </clipPath>
    <linearGradient id="cof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8A576"/>
      <stop offset="0.3" stop-color="#8A5430"/>
      <stop offset="1" stop-color="#3A1D0C"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="glass">
      <ellipse cx="100" cy="268" rx="96" ry="10" fill="#000" opacity="0.3" filter="url(#blur)"/>
      <g clip-path="url(#glassClip)">
        <rect width="200" height="260" fill="#FFFFFF" fill-opacity="0.16"/>
        <rect y="70" width="200" height="200" fill="url(#cof)"/>
        <ellipse cx="100" cy="70" rx="98" ry="8" fill="#C08A5E"/>
        <path d="M30 128 C80 100 130 150 175 118" fill="none" stroke="#F1CFA8" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
        <path d="M40 188 C90 166 120 210 165 184" fill="none" stroke="#F1CFA8" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
        <g fill="#FFFFFF" fill-opacity="0.38" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="2">
          <rect x="34" y="50" width="44" height="40" rx="7" transform="rotate(-12 56 70)"/>
          <rect x="88" y="54" width="40" height="36" rx="7" transform="rotate(9 108 72)"/>
          <rect x="136" y="48" width="38" height="36" rx="6" transform="rotate(-6 155 66)"/>
        </g>
        <g fill="#FFFFFF" fill-opacity="0.55">
          <circle cx="60" cy="150" r="3"/><circle cx="140" cy="210" r="4"/><circle cx="110" cy="140" r="2.5"/><circle cx="80" cy="230" r="3"/>
        </g>
        <rect x="24" y="0" width="12" height="260" fill="#FFFFFF" opacity="0.25"/>
      </g>
      <path d="M0 0 L200 0 L184 250 Q183 260 172 260 L28 260 Q17 260 16 250 Z" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <ellipse cx="100" cy="0" rx="100" ry="9" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <g id="pod">
      <path d="M-30 -22 L30 -22 L26 24 Q25 30 19 30 L-19 30 Q-25 30 -26 24 Z" fill="#FFFFFF" stroke="#121318" stroke-width="3"/>
      <rect x="-34" y="-32" width="68" height="12" fill="#FFD400" stroke="#121318" stroke-width="3"/>
      <rect x="-22" y="-8" width="44" height="18" fill="#2340FF"/>
      <text x="0" y="6" text-anchor="middle" class="hg" font-size="12" font-weight="700" fill="#FFFFFF">醒山</text>
    </g>
    <g id="tag">
      <path d="M0 -82 C -12 -120 -26 -140 -36 -168" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <polygon transform="translate(6 8)" points="-68,-70 -40,-104 40,-104 68,-70 68,104 -68,104" fill="#000" fill-opacity="0.28"/>
      <polygon points="-68,-70 -40,-104 40,-104 68,-70 68,104 -68,104" fill="#FFD400" stroke="#121318" stroke-width="3" stroke-linejoin="round"/>
      <circle cy="-82" r="9" fill="#2340FF" stroke="#121318" stroke-width="3"/>
      <text y="-36" text-anchor="middle" class="hg" font-size="26" font-weight="700" fill="#121318" letter-spacing="3">首单</text>
      <text y="34" text-anchor="middle" fill="#121318"><tspan class="av" font-weight="800" font-size="54">9.9</tspan><tspan class="hg" font-size="20" font-weight="700" dx="2">元</tspan></text>
      <line x1="-52" y1="56" x2="52" y2="56" stroke="#121318" stroke-width="2" stroke-dasharray="4 5"/>
      <text y="90" text-anchor="middle" class="hg" font-size="26" font-weight="700" fill="#121318">6 颗</text>
    </g>
  </defs>

  <!-- split background -->
  <rect width="1080" height="1920" fill="#E7E3DB"/>
  <rect x="500" y="0" width="580" height="1920" fill="#2340FF"/>

  <!-- occluded top decor -->
  <text x="250" y="300" text-anchor="middle" class="av" font-weight="800" font-size="420" fill="none" stroke="#23201C" stroke-opacity="0.08" stroke-width="3">7</text>
  <text x="790" y="300" text-anchor="middle" class="av" font-weight="800" font-size="420" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3">1</text>

  <!-- logo -->
  <g transform="translate(72 312)">
    <rect width="56" height="56" fill="#23201C"/>
    <path d="M10 40 L22 26 L29 33 L38 20 L48 40" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="40" cy="14" r="4" fill="#FFD400"/>
    <text x="70" y="36" class="hg" font-size="34" font-weight="700" fill="#23201C" letter-spacing="2">醒山</text>
    <text x="71" y="54" class="av" font-size="11" font-weight="700" fill="#23201C" fill-opacity="0.55" letter-spacing="3">XINGSHAN</text>
  </g>
  <text x="920" y="350" text-anchor="end" class="hg" font-size="20" font-weight="700" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="3">对比实验 · COMPARE</text>

  <!-- column labels -->
  <text x="72" y="418" class="hg" font-size="22" font-weight="700" fill="#8C8273" letter-spacing="3">传统手冲 · POUR-OVER</text>
  <text x="540" y="418" class="hg" font-size="22" font-weight="700" fill="#FFFFFF" fill-opacity="0.8" letter-spacing="3">醒山冻干 · XINGSHAN</text>

  <!-- headline -->
  <text x="72" y="540" class="hg" font-size="80" font-weight="700" fill="#23201C">手冲<tspan class="av" font-weight="800" font-size="112" dx="6">7</tspan><tspan dx="6">步，</tspan></text>
  <text x="540" y="540" class="hg" font-size="80" font-weight="700" fill="#FFFFFF">醒山<tspan class="av" font-weight="800" font-size="112" dx="6" fill="#FFD400">1</tspan><tspan dx="6">步</tspan></text>
  <circle cx="500" cy="512" r="28" fill="#121318"/>
  <text x="500" y="520" text-anchor="middle" class="av" font-style="italic" font-weight="800" font-size="22" fill="#FFD400">VS</text>

  <!-- selling point band -->
  <rect x="72" y="584" width="848" height="64" fill="#121318"/>
  <text x="496" y="628" text-anchor="middle" class="hg" font-size="36" font-weight="700" fill="#FFFFFF"><tspan fill="#FFD400">3 秒冷水速溶</tspan> · 0 糖 0 脂</text>

  <!-- LEFT: 7 steps -->
  <line x1="94" y1="742" x2="94" y2="1198" stroke="#23201C" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5"/>
  <g fill="#E7E3DB" stroke="#23201C" stroke-width="2">
    <circle cx="94" cy="742" r="18"/><circle cx="94" cy="818" r="18"/><circle cx="94" cy="894" r="18"/>
    <circle cx="94" cy="970" r="18"/><circle cx="94" cy="1046" r="18"/><circle cx="94" cy="1122" r="18"/><circle cx="94" cy="1198" r="18"/>
  </g>
  <g class="av" font-weight="700" font-size="20" fill="#23201C" text-anchor="middle">
    <text x="94" y="749">1</text><text x="94" y="825">2</text><text x="94" y="901">3</text>
    <text x="94" y="977">4</text><text x="94" y="1053">5</text><text x="94" y="1129">6</text><text x="94" y="1205">7</text>
  </g>
  <g class="hg" font-size="28" fill="#23201C">
    <text x="128" y="752">烧水至 <tspan class="av" font-weight="500">92 °C</tspan></text><text x="128" y="828">称豆 <tspan class="av" font-weight="500">15 g</tspan></text><text x="128" y="904">磨豆至中细</text>
    <text x="128" y="980">折滤纸、温杯</text><text x="128" y="1056">闷蒸萃取</text><text x="128" y="1132">分段注水</text><text x="128" y="1208">清洗器具</text>
  </g>
  <g class="av" font-weight="600" font-size="22" fill="#8C8273" text-anchor="end">
    <text x="480" y="752">4 min</text><text x="480" y="828">30 s</text><text x="480" y="904">1 min</text>
    <text x="480" y="980">1 min</text><text x="480" y="1056">30 s</text><text x="480" y="1132">2 min</text><text x="480" y="1208">3 min</text>
  </g>
  <g fill="#23201C" fill-opacity="0.07">
    <rect x="128" y="764" width="340" height="6"/><rect x="128" y="840" width="340" height="6"/><rect x="128" y="916" width="340" height="6"/>
    <rect x="128" y="992" width="340" height="6"/><rect x="128" y="1068" width="340" height="6"/><rect x="128" y="1144" width="340" height="6"/><rect x="128" y="1220" width="340" height="6"/>
  </g>
  <g fill="#A79B88">
    <rect x="128" y="764" width="340" height="6"/><rect x="128" y="840" width="42" height="6"/><rect x="128" y="916" width="85" height="6"/>
    <rect x="128" y="992" width="85" height="6"/><rect x="128" y="1068" width="42" height="6"/><rect x="128" y="1144" width="170" height="6"/><rect x="128" y="1220" width="255" height="6"/>
  </g>

  <!-- RIGHT: 1 step -->
  <rect x="540" y="670" width="110" height="30" fill="#FFD400"/>
  <text x="595" y="692" text-anchor="middle" class="av" font-weight="800" font-size="17" fill="#121318" letter-spacing="3">STEP 01</text>
  <text x="664" y="693" class="hg" font-size="20" font-weight="700" fill="#FFFFFF" fill-opacity="0.85">只有这一步</text>

  <use xlink:href="#glass" transform="translate(545 800) scale(0.9)"/>
  <use xlink:href="#pod" transform="translate(640 752) rotate(-18)"/>
  <g fill="#3A1D0C">
    <rect x="628" y="786" width="7" height="7" transform="rotate(20 631 789)"/>
    <rect x="648" y="790" width="6" height="6" transform="rotate(-15 651 793)"/>
  </g>

  <use xlink:href="#tag" transform="translate(830 925) rotate(6)"/>

  <text x="540" y="1110" class="hg" font-size="38" font-weight="700" fill="#FFFFFF">倒冷水，丢一颗</text>
  <text x="540" y="1158" class="hg" font-size="26" fill="#FFFFFF" fill-opacity="0.8">搅一下，3 秒就能喝</text>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2">
    <rect x="540" y="1182" width="118" height="40"/><rect x="666" y="1182" width="118" height="40"/><rect x="792" y="1182" width="118" height="40"/>
  </g>
  <g fill="none" stroke="#FFD400" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M555 1202 l6 6 l12 -12"/><path d="M681 1202 l6 6 l12 -12"/><path d="M807 1202 l6 6 l12 -12"/>
  </g>
  <g class="hg" font-size="22" font-weight="700" fill="#FFFFFF">
    <text x="584" y="1210">免烧水</text><text x="710" y="1210">免器具</text><text x="836" y="1210">免清洗</text>
  </g>

  <!-- totals -->
  <line x1="72" y1="1246" x2="480" y2="1246" stroke="#23201C" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="540" y1="1246" x2="920" y2="1246" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="72" y="1288" class="hg" font-size="24" font-weight="700" fill="#8C8273">总耗时 <tspan class="av" font-weight="800" font-size="34" fill="#23201C">≈ 12 min</tspan></text>
  <text x="540" y="1288" class="hg" font-size="24" font-weight="700" fill="#FFFFFF" fill-opacity="0.8">总耗时 <tspan class="av" font-weight="800" font-size="34" fill="#FFD400" fill-opacity="1">3 s</tspan></text>

  <!-- base -->
  <rect x="0" y="1306" width="1080" height="614" fill="#121318"/>
  <text x="48" y="1770" class="av" font-weight="800" font-size="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3">12 min</text>
  <text x="790" y="1800" text-anchor="middle" class="av" font-weight="800" font-size="260" fill="none" stroke="#FFD400" stroke-opacity="0.12" stroke-width="3">3 s</text>

  <text x="72" y="1332" class="hg" font-size="16" fill="#8E8F96">* 手冲步骤与耗时为常见流程估算；醒山冷水搅拌后速溶，图示为示意。</text>

  <!-- CTA -->
  <rect x="72" y="1344" width="848" height="78" fill="#FFD400"/>
  <text x="104" y="1396" class="hg" font-size="40" font-weight="700" fill="#121318">立即抢购 · 首单 <tspan class="av" font-weight="800" font-size="46">9.9</tspan> 元 6 颗</text>
  <rect x="842" y="1344" width="78" height="78" fill="#2340FF"/>
  <path d="M866 1383 H896 M884 1371 L896 1383 L884 1395" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
