  <text x="40" y="280" class="st" font-size="80" font-weight="700" fill="#3B1F3A"><tspan class="dd" font-weight="700" font-size="112" fill="#FF3D7F">3</tspan> 秒好心情</text>
  <path d="M180 300 q16 -10 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" fill="none" stroke="#FFC52E" stroke-width="6" stroke-linecap="round"/>

