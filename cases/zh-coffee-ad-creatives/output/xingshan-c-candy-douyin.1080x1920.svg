  <!-- flavor names -->
  <g class="st" font-size="30" font-weight="700" fill="#3B1F3A" text-anchor="middle">
    <text x="142.67" y="1176">美式</text><text x="284" y="1176">焦糖</text><text x="425.33" y="1176">椰香</text>
    <text x="566.67" y="1176">莓果</text><text x="708" y="1176">桂花</text><text x="849.33" y="1176">榛果</text>
  </g>
  <g class="dd" font-style="italic" font-size="18" text-anchor="middle">
    <text x="142.67" y="1206" fill="#3E9BD6">No.01</text><text x="284" y="1206" fill="#E57F45">No.02</text><text x="425.33" y="1206" fill="#3FAF7D">No.03</text>
    <text x="566.67" y="1206" fill="#E6507F">No.04</text><text x="708" y="1206" fill="#C98F00">No.05</text><text x="849.33" y="1206" fill="#8C68E6">No.06</text>
  </g>
  <g class="gs" font-size="14" fill="#3B1F3A" fill-opacity="0.55" letter-spacing="1.5" text-anchor="middle">
    <text x="142.67" y="1232">AMERICANO</text><text x="284" y="1232">CARAMEL</text><text x="425.33" y="1232">COCONUT</text>
    <text x="566.67" y="1232">BERRY</text><text x="708" y="1232">OSMANTHUS</text><text x="849.33" y="1232">HAZELNUT</text>
  </g>

  <text x="96" y="1302" class="pf" font-size="18" fill="#3B1F3A" fill-opacity="0.7">* 冷水搅拌后速溶，图示为示意；口味以实物为准。</text>

  <!-- CTA -->
  <rect x="96" y="1326" width="800" height="96" rx="48" fill="#3B1F3A"/>
  <text x="140" y="1389" class="pf" font-size="42" font-weight="600" fill="#FFF4E6">立即抢购 · 首单 <tspan class="dd" font-weight="700" font-size="52" fill="#FFE27A">9.9</tspan> 元 6 颗</text>
  <circle cx="846" cy="1374" r="34" fill="#FF3D7F"/>
  <path d="M832 1374 H858 M848 1364 L858 1374 L848 1384" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
