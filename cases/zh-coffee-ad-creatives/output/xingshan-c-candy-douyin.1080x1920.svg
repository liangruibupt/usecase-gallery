  <g transform="translate(142.67 1040)">
    <circle cx="6" cy="10" r="64" fill="#3B1F3A" opacity="0.18" filter="url(#sh)"/>
    <circle r="64" fill="#5DB8F0"/>
    <circle r="58" fill="#EEF1F4"/>
    <circle r="58" fill="none" stroke="#3E9BD6" stroke-width="2"/>
    <circle r="52" fill="#3A1D0C"/>
    <g fill="#9C6236">
      <rect x="-34" y="-26" width="10" height="9" rx="2" transform="rotate(20 -29 -21.5)"/>
      <rect x="6" y="-40" width="10" height="9" rx="2" transform="rotate(-15 11 -35.5)"/>
      <rect x="26" y="-10" width="10" height="9" rx="2" transform="rotate(35 31 -5.5)"/>
      <rect x="-16" y="6" width="10" height="9" rx="2" transform="rotate(10 -11 10.5)"/>
      <rect x="10" y="24" width="10" height="9" rx="2" transform="rotate(-25 15 28.5)"/>
      <rect x="-38" y="14" width="10" height="9" rx="2" transform="rotate(40 -33 18.5)"/>
    </g>
    <g fill="#C88A52">
      <rect x="-12" y="-24" width="10" height="9" rx="2" transform="rotate(-30 -7 -19.5)"/>
      <rect x="28" y="12" width="10" height="9" rx="2" transform="rotate(15 33 16.5)"/>
      <rect x="-28" y="-6" width="10" height="9" rx="2" transform="rotate(25 -23 -1.5)"/>
      <rect x="-4" y="34" width="10" height="9" rx="2" transform="rotate(-10 1 38.5)"/>
      <rect x="-24" y="26" width="10" height="9" rx="2" transform="rotate(30 -19 30.5)"/>
      <rect x="18" y="-30" width="10" height="9" rx="2" transform="rotate(5 23 -25.5)"/>
    </g>
    <g fill="#6B3A1C">
      <rect x="-4" y="-8" width="10" height="9" rx="2" transform="rotate(45 1 -3.5)"/>
      <rect x="32" y="-26" width="10" height="9" rx="2" transform="rotate(-20 37 -21.5)"/>
      <rect x="-46" y="-6" width="10" height="9" rx="2" transform="rotate(15 -41 -1.5)"/>
      <rect x="12" y="4" width="10" height="9" rx="2" transform="rotate(-40 17 8.5)"/>
    </g>
    <path d="M-52.8 -30.5 A61 61 0 0 1 -5.3 -60.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(284 1040)">
    <circle cx="6" cy="10" r="64" fill="#3B1F3A" opacity="0.18" filter="url(#sh)"/>
    <circle r="64" fill="#E57F45"/>
    <circle r="57" fill="#FF9A62"/>
    <circle r="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-45 -26 A52 52 0 0 1 -4.5 -51.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
    <circle r="32" fill="#FFF8F0"/>
    <text y="-1" text-anchor="middle" class="st" font-size="17" font-weight="700" fill="#3B1F3A">醒山</text>
    <text y="18" text-anchor="middle" class="dd" font-style="italic" font-size="13" fill="#E57F45">No.02</text>
    <g transform="rotate(15)"><rect x="-11" y="-68" width="22" height="18" rx="7" fill="#FFFFFF" fill-opacity="0.9" stroke="#E57F45" stroke-width="2"/><circle cy="-60" r="3.5" fill="#E57F45"/></g>
  </g>

  <g transform="translate(425.33 1040)">
    <circle cx="6" cy="10" r="64" fill="#3B1F3A" opacity="0.18" filter="url(#sh)"/>
    <circle r="64" fill="#3FAF7D"/>
    <circle r="57" fill="#5CCB98"/>
    <circle r="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-45 -26 A52 52 0 0 1 -4.5 -51.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
    <circle r="32" fill="#FFF8F0"/>
    <text y="-1" text-anchor="middle" class="st" font-size="17" font-weight="700" fill="#3B1F3A">醒山</text>
    <text y="18" text-anchor="middle" class="dd" font-style="italic" font-size="13" fill="#3FAF7D">No.03</text>
    <g transform="rotate(-25)"><rect x="-11" y="-68" width="22" height="18" rx="7" fill="#FFFFFF" fill-opacity="0.9" stroke="#3FAF7D" stroke-width="2"/><circle cy="-60" r="3.5" fill="#3FAF7D"/></g>
  </g>

  <g transform="translate(566.67 1040)">
    <circle cx="6" cy="10" r="64" fill="#3B1F3A" opacity="0.18" filter="url(#sh)"/>
    <circle r="64" fill="#E6507F"/>
    <circle r="57" fill="#FF6F9F"/>
    <circle r="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-45 -26 A52 52 0 0 1 -4.5 -51.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
    <circle r="32" fill="#FFF8F0"/>
    <text y="-1" text-anchor="middle" class="st" font-size="17" font-weight="700" fill="#3B1F3A">醒山</text>
    <text y="18" text-anchor="middle" class="dd" font-style="italic" font-size="13" fill="#E6507F">No.04</text>
    <g transform="rotate(35)"><rect x="-11" y="-68" width="22" height="18" rx="7" fill="#FFFFFF" fill-opacity="0.9" stroke="#E6507F" stroke-width="2"/><circle cy="-60" r="3.5" fill="#E6507F"/></g>
  </g>

  <g transform="translate(708 1040)">
    <circle cx="6" cy="10" r="64" fill="#3B1F3A" opacity="0.18" filter="url(#sh)"/>
    <circle r="64" fill="#E8A800"/>
    <circle r="57" fill="#FFC52E"/>
    <circle r="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-45 -26 A52 52 0 0 1 -4.5 -51.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
    <circle r="32" fill="#FFF8F0"/>
    <text y="-1" text-anchor="middle" class="st" font-size="17" font-weight="700" fill="#3B1F3A">醒山</text>
    <text y="18" text-anchor="middle" class="dd" font-style="italic" font-size="13" fill="#C98F00">No.05</text>
    <g transform="rotate(-10)"><rect x="-11" y="-68" width="22" height="18" rx="7" fill="#FFFFFF" fill-opacity="0.9" stroke="#E8A800" stroke-width="2"/><circle cy="-60" r="3.5" fill="#E8A800"/></g>
  </g>

  <g transform="translate(849.33 1040)">
    <circle cx="6" cy="10" r="64" fill="#3B1F3A" opacity="0.18" filter="url(#sh)"/>
    <circle r="64" fill="#8C68E6"/>
    <circle r="57" fill="#A989F5"/>
    <circle r="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-45 -26 A52 52 0 0 1 -4.5 -51.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
    <circle r="32" fill="#FFF8F0"/>
    <text y="-1" text-anchor="middle" class="st" font-size="17" font-weight="700" fill="#3B1F3A">醒山</text>
    <text y="18" text-anchor="middle" class="dd" font-style="italic" font-size="13" fill="#8C68E6">No.06</text>
    <g transform="rotate(45)"><rect x="-11" y="-68" width="22" height="18" rx="7" fill="#FFFFFF" fill-opacity="0.9" stroke="#8C68E6" stroke-width="2"/><circle cy="-60" r="3.5" fill="#8C68E6"/></g>
