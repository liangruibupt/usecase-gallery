<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <style>
    .st{font-family:'Songti SC',serif}
    .dd{font-family:'Didot',serif}
    .pf{font-family:'PingFang SC',sans-serif}
    .gs{font-family:'Gill Sans',sans-serif}
  </style>
  <defs>
    <clipPath id="panelClip"><rect x="72" y="900" width="848" height="1100" rx="40"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="petals">
      <circle r="90"/>
      <circle cx="86" cy="0" r="34"/><circle cx="69.6" cy="50.5" r="34"/><circle cx="26.6" cy="81.8" r="34"/>
      <circle cx="-26.6" cy="81.8" r="34"/><circle cx="-69.6" cy="50.5" r="34"/><circle cx="-86" cy="0" r="34"/>
      <circle cx="-69.6" cy="-50.5" r="34"/><circle cx="-26.6" cy="-81.8" r="34"/><circle cx="26.6" cy="-81.8" r="34"/>
      <circle cx="69.6" cy="-50.5" r="34"/>
    </g>
  </defs>

  <rect width="1080" height="1920" fill="#FFF4E6"/>

  <!-- occluded top zone: candy blobs (decor) -->
  <circle cx="120" cy="40" r="230" fill="#FFE27A"/>
  <circle cx="640" cy="-40" r="170" fill="#FFC6DA"/>
  <!-- sky block behind badge -->
  <circle cx="1000" cy="470" r="230" fill="#BFE6FF"/>

  <!-- sprinkles -->
  <g>
    <rect x="410" y="180" width="26" height="10" rx="5" fill="#5CCB98" transform="rotate(30 423 185)"/>
    <rect x="860" y="120" width="26" height="10" rx="5" fill="#A989F5" transform="rotate(-25 873 125)"/>
    <rect x="300" y="250" width="26" height="10" rx="5" fill="#FF9A62" transform="rotate(60 313 255)"/>
    <rect x="968" y="780" width="26" height="10" rx="5" fill="#FFC52E" transform="rotate(30 981 785)"/>
    <rect x="1000" y="960" width="26" height="10" rx="5" fill="#5CCB98" transform="rotate(-20 1013 965)"/>
    <rect x="958" y="1120" width="26" height="10" rx="5" fill="#FF6F9F" transform="rotate(60 971 1125)"/>
    <rect x="1010" y="1280" width="26" height="10" rx="5" fill="#A989F5" transform="rotate(15 1023 1285)"/>
    <rect x="22" y="1080" width="26" height="10" rx="5" fill="#FF9A62" transform="rotate(30 35 1085)"/>
    <rect x="22" y="1300" width="26" height="10" rx="5" fill="#5DB8F0" transform="rotate(-35 35 1305)"/>
  </g>

  <!-- logo -->
  <g transform="translate(72 312)">
    <rect width="56" height="56" rx="18" fill="#FF3D7F"/>
    <path d="M10 40 L22 26 L29 33 L38 20 L48 40" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="40" cy="14" r="4" fill="#FFE27A"/>
    <text x="70" y="36" class="st" font-size="36" font-weight="700" fill="#3B1F3A" letter-spacing="2">醒山</text>
    <text x="71" y="54" class="gs" font-size="12" fill="#3B1F3A" fill-opacity="0.6" letter-spacing="3">XINGSHAN</text>
  </g>

  <!-- headline -->
  <text x="66" y="540" class="st" font-size="120" font-weight="700" fill="#3B1F3A">挑一颗，</text>
  <text x="62" y="700" class="st" font-size="120" font-weight="700" fill="#3B1F3A"><tspan class="dd" font-weight="700" font-size="180" fill="#FF3D7F">3</tspan> 秒好心情</text>
  <path d="M300 726 q22 -14 44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0" fill="none" stroke="#FFC52E" stroke-width="8" stroke-linecap="round"/>

  <!-- price badge -->
  <g transform="translate(796 480) rotate(-8)">
    <use xlink:href="#petals" transform="translate(6 9)" fill="#3B1F3A" fill-opacity="0.16"/>
    <use xlink:href="#petals" fill="#FF3D7F"/>
    <circle r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
    <text y="-38" text-anchor="middle" class="pf" font-size="24" font-weight="600" fill="#FFFFFF" letter-spacing="3">首单</text>
    <text y="28" text-anchor="middle" fill="#FFFFFF"><tspan class="dd" font-weight="700" font-size="80">9.9</tspan><tspan class="pf" font-size="24" font-weight="600">元</tspan></text>
    <text y="64" text-anchor="middle" class="pf" font-size="24" font-weight="600" fill="#FFFFFF">6 颗</text>
  </g>

  <!-- selling point capsule -->
  <rect x="72" y="744" width="500" height="68" rx="34" fill="#FFE27A"/>
  <text x="104" y="791" class="pf" font-size="40" font-weight="600" fill="#3B1F3A">3 秒冷水速溶<tspan font-weight="400" fill-opacity="0.75"> · 0 糖 0 脂</tspan></text>

  <text x="72" y="866" class="gs" font-size="20" fill="#3B1F3A" fill-opacity="0.7" letter-spacing="4">SIX FLAVORS · COLD WATER READY</text>
  <text x="920" y="866" text-anchor="end" class="dd" font-style="italic" font-size="24" fill="#3B1F3A" fill-opacity="0.7">No.01 — 06</text>

  <!-- candy swatch panel -->
  <g clip-path="url(#panelClip)">
    <rect x="72" y="900" width="142" height="1020" fill="#BFE6FF"/>
    <rect x="213.33" y="900" width="142" height="1020" fill="#FFD3B8"/>
    <rect x="354.67" y="900" width="142" height="1020" fill="#C9F0DC"/>
    <rect x="496" y="900" width="142" height="1020" fill="#FFC6DA"/>
    <rect x="637.33" y="900" width="142" height="1020" fill="#FFEBA3"/>
    <rect x="778.67" y="900" width="142" height="1020" fill="#E0D3FF"/>
    <rect x="72" y="900" width="848" height="1020" fill="url(#sheen)"/>
  </g>

