<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <style>
    .cn{font-family:'Source Han Sans SC',sans-serif}
    .fu{font-family:'Futura',sans-serif}
    .av{font-family:'Avenir Next',sans-serif}
  </style>
  <defs>
    <radialGradient id="flash" cx="340" cy="480" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#77777C"/>
      <stop offset="0.35" stop-color="#3C3C40"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </radialGradient>
    <radialGradient id="vig" cx="400" cy="420" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="0.25" stop-color="#6E6E70"/>
      <stop offset="0.42" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E6E6E6"/>
      <stop offset="0.7" stop-color="#555555"/>
      <stop offset="1" stop-color="#111111"/>
