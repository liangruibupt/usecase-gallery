<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>
    .hg{font-family:'Hiragino Sans GB',sans-serif}
    .av{font-family:'Avenir Next',sans-serif}
  </style>
  <defs>
    <clipPath id="glassClip">
      <path d="M0 0 L200 0 L184 250 Q183 260 172 260 L28 260 Q17 260 16 250 Z"/>
    </clipPath>
    <linearGradient id="cof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8A576"/>
      <stop offset="0.3" stop-color="#8A5430"/>
      <stop offset="1" stop-color="#3A1D0C"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="glass">
      <ellipse cx="100" cy="268" rx="96" ry="10" fill="#000" opacity="0.3" filter="url(#blur)"/>
      <g clip-path="url(#glassClip)">
        <rect width="200" height="260" fill="#FFFFFF" fill-opacity="0.16"/>
        <rect y="70" width="200" height="200" fill="url(#cof)"/>
        <ellipse cx="100" cy="70" rx="98" ry="8" fill="#C08A5E"/>
        <path d="M30 128 C80 100 130 150 175 118" fill="none" stroke="#F1CFA8" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
        <path d="M40 188 C90 166 120 210 165 184" fill="none" stroke="#F1CFA8" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
        <g fill="#FFFFFF" fill-opacity="0.38" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="2">
          <rect x="34" y="50" width="44" height="40" rx="7" transform="rotate(-12 56 70)"/>
          <rect x="88" y="54" width="40" height="36" rx="7" transform="rotate(9 108 72)"/>
          <rect x="136" y="48" width="38" height="36" rx="6" transform="rotate(-6 155 66)"/>
        </g>
        <g fill="#FFFFFF" fill-opacity="0.55">
          <circle cx="60" cy="150" r="3"/><circle cx="140" cy="210" r="4"/><circle cx="110" cy="140" r="2.5"/><circle cx="80" cy="230" r="3"/>
        </g>
        <rect x="24" y="0" width="12" height="260" fill="#FFFFFF" opacity="0.25"/>
      </g>
      <path d="M0 0 L200 0 L184 250 Q183 260 172 260 L28 260 Q17 260 16 250 Z" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <ellipse cx="100" cy="0" rx="100" ry="9" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <g id="pod">
      <path d="M-30 -22 L30 -22 L26 24 Q25 30 19 30 L-19 30 Q-25 30 -26 24 Z" fill="#FFFFFF" stroke="#121318" stroke-width="3"/>
      <rect x="-34" y="-32" width="68" height="12" fill="#FFD400" stroke="#121318" stroke-width="3"/>
      <rect x="-22" y="-8" width="44" height="18" fill="#2340FF"/>
      <text x="0" y="6" text-anchor="middle" class="hg" font-size="12" font-weight="700" fill="#FFFFFF">醒山</text>
    </g>
    <g id="tag">
      <path d="M0 -82 C -12 -120 -26 -140 -36 -168" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <polygon transform="translate(6 8)" points="-68,-70 -40,-104 40,-104 68,-70 68,104 -68,104" fill="#000" fill-opacity="0.28"/>
      <polygon points="-68,-70 -40,-104 40,-104 68,-70 68,104 -68,104" fill="#FFD400" stroke="#121318" stroke-width="3" stroke-linejoin="round"/>
      <circle cy="-82" r="9" fill="#2340FF" stroke="#121318" stroke-width="3"/>
      <text y="-36" text-anchor="middle" class="hg" font-size="26" font-weight="700" fill="#121318" letter-spacing="3">首单</text>
      <text y="34" text-anchor="middle" fill="#121318"><tspan class="av" font-weight="800" font-size="54">9.9</tspan><tspan class="hg" font-size="20" font-weight="700" dx="2">元</tspan></text>
      <line x1="-52" y1="56" x2="52" y2="56" stroke="#121318" stroke-width="2" stroke-dasharray="4 5"/>
      <text y="90" text-anchor="middle" class="hg" font-size="26" font-weight="700" fill="#121318">6 颗</text>
    </g>
  </defs>

  <rect width="1080" height="1350" fill="#E7E3DB"/>
  <rect x="540" y="0" width="540" height="1350" fill="#2340FF"/>

  <!-- logo -->
  <g transform="translate(72 72)">
    <rect width="56" height="56" fill="#23201C"/>
    <path d="M10 40 L22 26 L29 33 L38 20 L48 40" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="40" cy="14" r="4" fill="#FFD400"/>
    <text x="70" y="36" class="hg" font-size="34" font-weight="700" fill="#23201C" letter-spacing="2">醒山</text>
    <text x="71" y="54" class="av" font-size="11" font-weight="700" fill="#23201C" fill-opacity="0.55" letter-spacing="3">XINGSHAN</text>
  </g>
  <text x="1008" y="110" text-anchor="end" class="hg" font-size="20" font-weight="700" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="3">对比实验 · COMPARE</text>

  <text x="72" y="196" class="hg" font-size="22" font-weight="700" fill="#8C8273" letter-spacing="3">传统手冲 · POUR-OVER</text>
  <text x="584" y="196" class="hg" font-size="22" font-weight="700" fill="#FFFFFF" fill-opacity="0.8" letter-spacing="3">醒山冻干 · XINGSHAN</text>

  <!-- headline -->
  <text x="72" y="318" class="hg" font-size="88" font-weight="700" fill="#23201C">手冲<tspan class="av" font-weight="800" font-size="124" dx="6">7</tspan><tspan dx="6">步，</tspan></text>
  <text x="584" y="318" class="hg" font-size="88" font-weight="700" fill="#FFFFFF">醒山<tspan class="av" font-weight="800" font-size="124" dx="6" fill="#FFD400">1</tspan><tspan dx="6">步</tspan></text>
  <circle cx="540" cy="288" r="30" fill="#121318"/>
  <text x="540" y="296" text-anchor="middle" class="av" font-style="italic" font-weight="800" font-size="24" fill="#FFD400">VS</text>

  <rect x="72" y="352" width="936" height="68" fill="#121318"/>
  <text x="540" y="399" text-anchor="middle" class="hg" font-size="38" font-weight="700" fill="#FFFFFF"><tspan fill="#FFD400">3 秒冷水速溶</tspan> · 0 糖 0 脂</text>

  <!-- LEFT: 7 steps -->
  <line x1="96" y1="481" x2="96" y2="985" stroke="#23201C" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5"/>
  <g fill="#E7E3DB" stroke="#23201C" stroke-width="2">
    <circle cx="96" cy="481" r="20"/><circle cx="96" cy="565" r="20"/><circle cx="96" cy="649" r="20"/>
    <circle cx="96" cy="733" r="20"/><circle cx="96" cy="817" r="20"/><circle cx="96" cy="901" r="20"/><circle cx="96" cy="985" r="20"/>
  </g>
  <g class="av" font-weight="700" font-size="21" fill="#23201C" text-anchor="middle">
    <text x="96" y="489">1</text><text x="96" y="573">2</text><text x="96" y="657">3</text>
    <text x="96" y="741">4</text><text x="96" y="825">5</text><text x="96" y="909">6</text><text x="96" y="993">7</text>
  </g>
  <g class="hg" font-size="30" fill="#23201C">
    <text x="134" y="492">烧水至 <tspan class="av" font-weight="500">92 °C</tspan></text><text x="134" y="576">称豆 <tspan class="av" font-weight="500">15 g</tspan></text><text x="134" y="660">磨豆至中细</text>
    <text x="134" y="744">折滤纸、温杯</text><text x="134" y="828">闷蒸萃取</text><text x="134" y="912">分段注水</text><text x="134" y="996">清洗器具</text>
  </g>
  <g class="av" font-weight="600" font-size="24" fill="#8C8273" text-anchor="end">
    <text x="520" y="492">4 min</text><text x="520" y="576">30 s</text><text x="520" y="660">1 min</text>
    <text x="520" y="744">1 min</text><text x="520" y="828">30 s</text><text x="520" y="912">2 min</text><text x="520" y="996">3 min</text>
  </g>
  <g fill="#23201C" fill-opacity="0.07">
    <rect x="134" y="506" width="360" height="7"/><rect x="134" y="590" width="360" height="7"/><rect x="134" y="674" width="360" height="7"/>
    <rect x="134" y="758" width="360" height="7"/><rect x="134" y="842" width="360" height="7"/><rect x="134" y="926" width="360" height="7"/><rect x="134" y="1010" width="360" height="7"/>
  </g>
  <g fill="#A79B88">
    <rect x="134" y="506" width="360" height="7"/><rect x="134" y="590" width="45" height="7"/><rect x="134" y="674" width="90" height="7"/>
    <rect x="134" y="758" width="90" height="7"/><rect x="134" y="842" width="45" height="7"/><rect x="134" y="926" width="180" height="7"/><rect x="134" y="1010" width="270" height="7"/>
  </g>

  <!-- RIGHT: 1 step -->
  <rect x="584" y="444" width="122" height="34" fill="#FFD400"/>
  <text x="645" y="468" text-anchor="middle" class="av" font-weight="800" font-size="19" fill="#121318" letter-spacing="3">STEP 01</text>
  <text x="722" y="469" class="hg" font-size="22" font-weight="700" fill="#FFFFFF" fill-opacity="0.85">只有这一步</text>

  <use xlink:href="#glass" transform="translate(595 572) scale(0.95)"/>
  <use xlink:href="#pod" transform="translate(690 528) rotate(-18)"/>
  <g fill="#3A1D0C">
    <rect x="678" y="562" width="7" height="7" transform="rotate(20 681 565)"/>
    <rect x="698" y="560" width="6" height="6" transform="rotate(-15 701 563)"/>
  </g>

  <use xlink:href="#tag" transform="translate(908 706) rotate(6) scale(1.05)"/>

  <text x="584" y="890" class="hg" font-size="40" font-weight="700" fill="#FFFFFF">倒冷水，丢一颗</text>
  <text x="584" y="940" class="hg" font-size="28" fill="#FFFFFF" fill-opacity="0.8">搅一下，3 秒就能喝</text>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2">
    <rect x="584" y="964" width="128" height="42"/><rect x="722" y="964" width="128" height="42"/><rect x="860" y="964" width="128" height="42"/>
  </g>
  <g fill="none" stroke="#FFD400" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 985 l6 6 l12 -12"/><path d="M738 985 l6 6 l12 -12"/><path d="M876 985 l6 6 l12 -12"/>
  </g>
  <g class="hg" font-size="24" font-weight="700" fill="#FFFFFF">
    <text x="630" y="994">免烧水</text><text x="768" y="994">免器具</text><text x="906" y="994">免清洗</text>
  </g>

  <!-- totals -->
  <line x1="72" y1="1040" x2="520" y2="1040" stroke="#23201C" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="584" y1="1040" x2="1008" y2="1040" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="72" y="1080" class="hg" font-size="26" font-weight="700" fill="#8C8273">总耗时 <tspan class="av" font-weight="800" font-size="36" fill="#23201C">≈ 12 min</tspan></text>
  <text x="584" y="1080" class="hg" font-size="26" font-weight="700" fill="#FFFFFF" fill-opacity="0.8">总耗时 <tspan class="av" font-weight="800" font-size="36" fill="#FFD400" fill-opacity="1">3 s</tspan></text>

  <!-- base -->
  <rect x="0" y="1100" width="1080" height="250" fill="#121318"/>
  <text x="72" y="1140" class="hg" font-size="17" fill="#8E8F96">* 手冲步骤与耗时为常见流程估算；醒山冷水搅拌后速溶，图示为示意。</text>

  <rect x="72" y="1160" width="936" height="104" fill="#FFD400"/>
  <text x="112" y="1228" class="hg" font-size="46" font-weight="700" fill="#121318">立即抢购 · 首单 <tspan class="av" font-weight="800" font-size="54">9.9</tspan> 元 6 颗</text>
  <rect x="904" y="1160" width="104" height="104" fill="#2340FF"/>
  <path d="M938 1212 H974 M960 1198 L974 1212 L960 1226" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
