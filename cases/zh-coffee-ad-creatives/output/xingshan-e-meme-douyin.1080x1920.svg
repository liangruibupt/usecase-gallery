<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <style>
    .hv{font-family:'Source Han Sans SC',sans-serif}
    .pf{font-family:'PingFang SC',sans-serif}
    .gs{font-family:'Gill Sans',sans-serif}
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="3.2" fill="#8E0B06" fill-opacity="0.32"/>
    </pattern>
    <path id="ray" d="M0 0 L-70 -760 L70 -760 Z"/>
    <clipPath id="cupClip">
      <path d="M0 0 L200 0 L185 190 Q184 200 174 200 L26 200 Q16 200 15 190 Z"/>
    </clipPath>
    <linearGradient id="cof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9784A"/>
      <stop offset="0.3" stop-color="#6E3B1E"/>
      <stop offset="1" stop-color="#2E1508"/>
    </linearGradient>
    <path id="spark" d="M0 -18 L5 -5 L18 0 L5 5 L0 18 L-5 5 L-18 0 L-5 -5 Z"/>
    <g id="cup">
      <ellipse cx="100" cy="212" rx="96" ry="10" fill="#000" opacity="0.35"/>
      <path d="M0 0 L200 0 L185 190 Q184 200 174 200 L26 200 Q16 200 15 190 Z" fill="#FFFFFF" fill-opacity="0.3"/>
      <g clip-path="url(#cupClip)">
        <rect x="0" y="48" width="200" height="160" fill="url(#cof)"/>
        <ellipse cx="100" cy="48" rx="98" ry="7" fill="#C98A58"/>
        <g fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-width="2">
          <rect x="30" y="28" width="42" height="38" rx="7" transform="rotate(-12 51 47)"/>
          <rect x="82" y="32" width="38" height="34" rx="7" transform="rotate(9 101 49)"/>
          <rect x="130" y="26" width="38" height="36" rx="6" transform="rotate(-6 149 44)"/>
        </g>
        <rect x="18" y="0" width="10" height="200" fill="#FFFFFF" opacity="0.3"/>
      </g>
      <g fill="#111111" stroke="#FFFFFF" stroke-width="2.5">
        <rect x="36" y="86" width="58" height="34" rx="10"/>
        <rect x="106" y="86" width="58" height="34" rx="10"/>
      </g>
      <rect x="92" y="94" width="16" height="7" fill="#111111"/>
      <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85">
        <path d="M48 96 L60 92"/><path d="M118 96 L130 92"/>
      </g>
      <path d="M72 150 Q106 170 138 140" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 0 L200 0 L185 190 Q184 200 174 200 L26 200 Q16 200 15 190 Z" fill="none" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="100" cy="0" rx="100" ry="10" fill="#FFFFFF" fill-opacity="0.3" stroke="#111111" stroke-width="6"/>
      <g fill="#FFFFFF" stroke="#111111" stroke-width="3" stroke-linejoin="round">
        <use xlink:href="#spark" transform="translate(-30 20)"/>
        <use xlink:href="#spark" transform="translate(225 40) scale(0.8)"/>
        <use xlink:href="#spark" transform="translate(220 160) scale(0.6)"/>
      </g>
    </g>
    <g id="stamp">
      <rect x="-87" y="-87" width="190" height="190" fill="#111111"/>
      <rect x="-95" y="-95" width="190" height="190" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
      <rect x="-82" y="-82" width="164" height="164" fill="none" stroke="#EE2B1E" stroke-width="4"/>
      <rect x="-76" y="-76" width="152" height="152" fill="none" stroke="#EE2B1E" stroke-width="1.5"/>
      <text y="-40" text-anchor="middle" class="hv" font-weight="900" font-size="26" fill="#EE2B1E" letter-spacing="6">首单</text>
      <text y="24" text-anchor="middle" fill="#EE2B1E"><tspan class="gs" font-weight="700" font-size="70">9.9</tspan><tspan class="hv" font-weight="900" font-size="24" dx="2">元</tspan></text>
      <line x1="-56" y1="38" x2="56" y2="38" stroke="#EE2B1E" stroke-width="2"/>
      <text y="66" text-anchor="middle" class="hv" font-weight="900" font-size="26" fill="#EE2B1E">6 颗</text>
    </g>
  </defs>

  <!-- background -->
  <rect width="1080" height="1920" fill="#EE2B1E"/>
  <g transform="translate(760 900)" fill="#D81E12">
    <use xlink:href="#ray"/><use xlink:href="#ray" transform="rotate(30)"/><use xlink:href="#ray" transform="rotate(60)"/>
    <use xlink:href="#ray" transform="rotate(90)"/><use xlink:href="#ray" transform="rotate(120)"/><use xlink:href="#ray" transform="rotate(150)"/>
    <use xlink:href="#ray" transform="rotate(180)"/><use xlink:href="#ray" transform="rotate(210)"/><use xlink:href="#ray" transform="rotate(240)"/>
    <use xlink:href="#ray" transform="rotate(270)"/><use xlink:href="#ray" transform="rotate(300)"/><use xlink:href="#ray" transform="rotate(330)"/>
  </g>
  <rect width="1080" height="1920" fill="url(#dots)"/>

  <!-- occluded top decor -->
  <text x="540" y="250" text-anchor="middle" class="hv" font-weight="900" font-size="250" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4">？？？</text>

  <!-- occluded bottom decor: caution tapes -->
  <g transform="translate(540 1580) rotate(-5)">
    <rect x="-720" y="-44" width="1440" height="88" fill="#111111"/>
    <text x="-720" y="16" class="hv" font-weight="900" font-size="42" fill="#FFFFFF" letter-spacing="4">已读不回 · 已读不回 · 已读不回 · 已读不回 · 已读不回 · 已读不回</text>
  </g>
  <g transform="translate(540 1770) rotate(4)">
    <rect x="-720" y="-44" width="1440" height="88" fill="#FFFFFF"/>
    <text x="-720" y="16" class="hv" font-weight="900" font-size="42" fill="#111111" letter-spacing="4">3 秒已溶 · 3 秒已溶 · 3 秒已溶 · 3 秒已溶 · 3 秒已溶 · 3 秒已溶</text>
  </g>

  <!-- logo -->
  <g transform="translate(72 312)">
    <rect width="56" height="56" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <path d="M10 40 L22 26 L29 33 L38 20 L48 40" stroke="#EE2B1E" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="40" cy="14" r="4" fill="#111111"/>
    <text x="70" y="36" class="hv" font-weight="900" font-size="36" fill="#FFFFFF" letter-spacing="2">醒山</text>
    <text x="71" y="54" class="gs" font-weight="700" font-size="12" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="3">XINGSHAN</text>
  </g>
  <text x="920" y="350" text-anchor="end" class="pf" font-weight="600" font-size="22" fill="#FFFFFF" letter-spacing="2">热梗实测 · 打工人自用</text>

  <!-- headline -->
  <g transform="translate(64 548) scale(1 1.12)">
    <text x="8" y="8" class="hv" font-weight="900" font-size="150" fill="#111111">比你回</text>
    <text class="hv" font-weight="900" font-size="150" fill="none" stroke="#111111" stroke-width="14" stroke-linejoin="round">比你回</text>
    <text class="hv" font-weight="900" font-size="150" fill="#FFFFFF">比你回</text>
  </g>
  <g transform="translate(64 734) scale(1 1.12)">
    <text x="8" y="8" class="hv" font-weight="900" font-size="150" fill="#111111">老板消息</text>
    <text class="hv" font-weight="900" font-size="150" fill="none" stroke="#111111" stroke-width="14" stroke-linejoin="round">老板消息</text>
    <text class="hv" font-weight="900" font-size="150" fill="#FFFFFF">老板消息</text>
  </g>
  <g transform="translate(72 972) rotate(-3)">
    <rect x="0" y="-160" width="470" height="196" fill="#111111"/>
    <rect x="-10" y="-170" width="470" height="196" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <g transform="scale(1 1.12)">
      <text x="6" y="0" class="hv" font-weight="900" font-size="150" fill="#111111">还<tspan fill="#EE2B1E">快！</tspan></text>
    </g>
  </g>

  <!-- price stamp -->
  <use xlink:href="#stamp" transform="translate(790 490) rotate(-12)"/>

  <!-- meme -->
  <g transform="translate(760 770)">
    <text text-anchor="middle" class="hv" font-weight="900" font-size="34" fill="none" stroke="#111111" stroke-width="8" stroke-linejoin="round">3 秒已溶</text>
    <text text-anchor="middle" class="hv" font-weight="900" font-size="34" fill="#FFFFFF">3 秒已溶</text>
  </g>
  <use xlink:href="#cup" transform="translate(660 800)"/>

  <!-- chat screenshot -->
  <rect x="80" y="1026" width="848" height="218" fill="#111111"/>
  <rect x="72" y="1018" width="848" height="218" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
  <text x="96" y="1050" class="pf" font-weight="600" font-size="22" fill="#111111">工作群（3）</text>
  <text x="896" y="1050" text-anchor="end" class="gs" font-size="22" fill="#888888">07:58</text>
  <line x1="74" y1="1064" x2="918" y2="1064" stroke="#E2E2E2" stroke-width="2"/>

  <circle cx="120" cy="1104" r="26" fill="#111111"/>
  <text x="120" y="1113" text-anchor="middle" class="pf" font-weight="600" font-size="24" fill="#FFFFFF">板</text>
  <rect x="158" y="1080" width="222" height="48" rx="12" fill="#EDEDED"/>
  <text x="176" y="1113" class="pf" font-size="26" fill="#111111">方案改完了吗？</text>
  <text x="396" y="1112" class="pf" font-size="20" fill="#888888">已读 · 23 分钟未回</text>

  <circle cx="872" cy="1186" r="26" fill="#EE2B1E" stroke="#111111" stroke-width="3"/>
  <path d="M858 1194 L866 1184 L871 1189 L877 1180 L886 1194" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="556" y="1162" width="282" height="48" rx="12" fill="#111111"/>
  <text x="576" y="1195" class="pf" font-weight="600" font-size="26" fill="#FFFFFF">冷水一倒，已溶</text>
  <path d="M780 1186 l8 8 l16 -16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="1194" text-anchor="end" class="pf" font-size="20" fill="#888888">用时 <tspan class="gs" font-weight="700" font-size="26" fill="#EE2B1E">3.00 s</tspan></text>

  <!-- selling point -->
  <rect x="72" y="1252" width="848" height="58" fill="#111111"/>
  <text x="496" y="1293" text-anchor="middle" class="hv" font-weight="900" font-size="34" fill="#FFFFFF">3 秒冷水速溶<tspan font-weight="500" fill="#BBBBBB"> · 0 糖 0 脂</tspan></text>

  <text x="72" y="1332" class="pf" font-size="16" fill="#FFFFFF" fill-opacity="0.85">* 冷水搅拌后速溶，图示为示意；梗图仅为趣味表达。</text>

  <!-- CTA -->
  <rect x="80" y="1352" width="840" height="70" fill="#111111"/>
  <rect x="72" y="1344" width="840" height="70" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
  <text x="104" y="1393" class="hv" font-weight="900" font-size="38" fill="#111111">立即抢购 · 首单 <tspan class="gs" font-weight="700" font-size="44" fill="#EE2B1E">9.9</tspan> 元 6 颗</text>
  <g fill="none" stroke="#EE2B1E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M826 1365 l12 14 l-12 14"/><path d="M846 1365 l12 14 l-12 14"/><path d="M866 1365 l12 14 l-12 14"/>
  </g>
</svg>
